[package]
name = "riftbound-desktop-client"
version = "0.1.0"
description = "Riftbound desktop game client"
authors = ["Riftbound Client Rule Engine contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "riftbound_desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
