      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d2": 2, "#d1": 2, "#d3": 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-assigned, player: A, to: "#d2", amount: 2 }
          - { timing: combat.damage-assigned, player: A, to: "#d1", amount: 2 }
          - { timing: combat.damage-assigned, player: A, to: "#d3", amount: 1 }
      state: []
      rejected: null
    notes: "467.2.c.7 的示例结构：同优先级的多个单位之间顺序自选，这里先给 #d2 再给 #d1 也合法，最后才轮到无能力单位。"

  - id: combat-tank-plus-backline-conflict-choose-one
    rule: ["1.5:467.2.c.8"]
    title: "同一单位兼有 Tank 与 Backline：分配方选其中一个要求生效（最先或最后），不能取中间"
