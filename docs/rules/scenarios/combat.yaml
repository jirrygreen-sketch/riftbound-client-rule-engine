area: combat
rulesetVersion: core-1.5
sources:
  - "1.5:461-468"                 # 战斗与战斗步骤
  - "1.5:466.2.c"                 # 攻击方/防御方指定与焦点
  - "1.5:467.2"                   # 战斗伤害步骤（分配与结算顺序）
  - "1.5:468"                     # 结算步骤、战斗清理、战斗结果
  - "1.5:341-348"                 # Showdown 的开启、焦点传递与结束
  - "1.5:316.8"                   # 主阶段中的 Showdown / 战斗
  - "1.5:323.7-323.13"            # 清理中 stage/开启 Showdown 与战斗
  - "1.5:190.3-190.4"             # Contested 与控制权建立
  - "1.5:462-464"                 # 战斗的 stage、参与方恰好两人
  - "1.5:383.4.e"                 # 攻击触发（每次战斗首次获得攻击方指定）
  - "1.5:808"                     # Deathknell
  - "1.5:831"                     # Disarm
  - "1.5:830"                     # Deploy（与战斗相关的部分）
  - "1.5:143.5"                   # 单位不能被附着
  - "1.5:815"                     # Tank
  - "1.5:826"                     # Backline
  - "1.5:142.4"                   # 致命伤害
  - "1.5:143.2.c"                 # 负 Might 在战斗求和时按 0 计
  - "https://playriftbound.com/en-us/news/announcements/core-rules-radiance-patch-notes-effective-october-16-2026/"
scenarios:
  # ===== 宣告攻击 / Showdown 开启与焦点 =====
  - id: combat-move-opens-noncombat-showdown-contested
    rule: ["1.5:190.3.a", "1.5:323.7", "1.5:323.11", "1.5:345", "1.5:316.8.b.1"]
    title: "移动到无人战场即施加争夺，清理后以非战斗 Showdown 开启，移动方获焦点"
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:2)#u1"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: null, units: { A: [], B: [] } }
      chain: []
    commands:
      - { player: A, do: move, unit: "#u1", to: bf1 }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: unit.moved, object: "#u1", to: bf1 }
          - { timing: battlefield.contested, battlefield: bf1, by: A }
          - { timing: showdown.opened, battlefield: bf1, kind: non-combat }
          - { timing: focus.gained, player: A }
      state:
        - { path: "battlefields.bf1.contested", equals: true }
        - { path: "turn.state", equals: showdown-open }
        - { path: "turn.focus", equals: A }
      rejected: null
    notes: "移动完成先做一次清理（1.5:455）；清理第 7 步标记 Showdown staged、第 9 步在中立开放态开启；施加争夺的一方在 Showdown 开启时获得焦点。"

  - id: combat-move-to-enemy-stages-combat-opens-combat-showdown
    rule: ["1.5:323.8", "1.5:323.12", "1.5:462", "1.5:463", "1.5:466.2.c.1.a", "1.5:466.2.c.3"]
    title: "移动进敌方占据的战场：争夺+战斗 staged，中立开放态下清理直接开启战斗 Showdown，攻击方获得焦点"
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:3)#u1"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
      - { player: A, do: move, unit: "#u1", to: bf1 }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: battlefield.contested, battlefield: bf1, by: A }
          - { timing: combat.staged, battlefield: bf1 }
          - { timing: combat.opened, battlefield: bf1, attacker: A, defender: B }
          - { timing: showdown.opened, battlefield: bf1, kind: combat }
          - { timing: focus.gained, player: A }
      state:
        - { path: "combat.attacker", equals: A }
        - { path: "combat.defender", equals: B }
        - { path: "battlefields.bf1.units.#u1.designation", equals: attacker }
        - { path: "battlefields.bf1.units.#d1.designation", equals: defender }
        - { path: "turn.focus", equals: A }
      rejected: null
    notes: "清理第 8 步标记战斗 staged、第 10 步在中立开放态开启；战斗 Showdown 开启时施加争夺的一方（攻击方）获得焦点（1.5:466.2.c.1.a）。"

  - id: combat-focus-does-not-pass-after-trigger-opened-chain
    rule: ["1.5:466.2.d", "1.5:466.2.d.1", "1.5:466.2.e", "1.5:346.1", "1.5:347.1"]
    title: "战斗开启时攻击触发入链：攻击方先放触发；触发链清空回到开放态后焦点不传递"
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 1, runes: { ready: [fury], exhausted: [] }, hand: ["@spell(cost:1,domain:fury,speed:reaction,text:'Give a unit here +1 might this turn.')"], base: ["@unit(might:2,text:'When I attack, draw 1.')#u1"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
      - { player: A, do: move, unit: "#u1", to: bf1 }
      - { player: A, do: pass }
      - { player: B, do: pass }
      - { player: A, do: play, card: "hand[0]", to: bf1, pay: { energy: 1, power: [fury] } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.opened, battlefield: bf1, attacker: A, defender: B }
          - { timing: combat.attack-declared, object: "#u1" }
          - { timing: chain.item-pending, item: "trigger:#u1" }
          - { timing: chain.item-finalized, item: "trigger:#u1" }
          - { timing: chain.item-resolved, item: "trigger:#u1" }
          - { timing: chain.item-pending, item: "A:hand[0]" }
      state:
        - { path: "turn.focus", equals: A }
      rejected: null
    notes: "攻击触发在战斗开启时作为 Pending 入链并形成战斗链（State 关闭）；该链由触发能力开启，链清空回到开放态时焦点不传递（1.5:346.1），攻击方仍持焦点可继续出牌。"

  - id: combat-focus-passes-after-player-chain
    rule: ["1.5:347.1.b", "1.5:340.2.a"]
    title: "玩家在 Showdown 中打出的链关闭后，焦点传递给下一位玩家"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf1, focus: A }
      players:
        A: { energy: 1, runes: { ready: [fury], exhausted: [] }, hand: ["@spell(cost:1,domain:fury,speed:action,text:'Draw 1.')"], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1, power: [fury] } }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "A:hand[0]" }
          - { timing: chain.item-finalized, item: "A:hand[0]" }
          - { timing: chain.item-resolved, item: "A:hand[0]" }
          - { timing: focus.gained, player: B }
      state:
        - { path: "turn.focus", equals: B }
      rejected: null
    notes: "玩家主动出牌形成的链关闭后焦点传给回合顺序下一位（1.5:347.1.b），与触发开启的链形成对照。"

  - id: combat-showdown-ends-after-all-pass
    rule: ["1.5:347.2.a", "1.5:348", "1.5:348.1", "1.5:467.2"]
    title: "双方依次放弃焦点后战斗 Showdown 结束，进入战斗伤害步骤"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf1, focus: B }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:3)#u1"], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: showdown.closed, battlefield: bf1, kind: combat }
          - { timing: combat.damage-started, battlefield: bf1 }
          - { timing: combat.damage-dealt }
      state:
        - { path: "turn.state", equals: showdown-closed }
      rejected: null
    notes: "所有玩家依次放弃则 Showdown 关闭（1.5:348）；战斗 Showdown 关闭后执行剩余战斗步骤，从伤害步骤开始。focus 从 B 开始，B、A 各 pass 一次即全体依次 pass。"

  - id: combat-noncombat-showdown-control-established
    rule: ["1.5:348.2.a", "1.5:348.2.a.1", "1.5:190.4", "1.5:471.1"]
    title: "非战斗 Showdown 全体 pass 结束：唯一在场方建立控制并触发征服"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf1, focus: B }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: null, units: { A: ["@unit(might:2)#u1"], B: [] } }
      chain: []
    commands:
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: showdown.closed, battlefield: bf1, kind: non-combat }
          - { timing: battlefield.control-established, battlefield: bf1, player: A }
          - { timing: score.conquered, battlefield: bf1, player: A }
      state:
        - { path: "battlefields.bf1.controller", equals: A }
        - { path: "players.A.score", equals: 1 }
      rejected: null
    notes: "非战斗 Showdown 结束时只有一方单位在场且该方尚未控制战场则建立控制；本回合未在此得过分则构成征服（1.5:348.2.a.1）。"

  - id: combat-defender-mid-showdown-move-converts-to-combat-showdown
    rule: ["1.5:316.8.b.1.a", "1.5:323.13", "1.5:466.2.c.1.b"]
    title: "非战斗 Showdown 期间防御方移动到同一战场：清理后转为战斗 Showdown，焦点保持不重置"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:2)#d1"], score: 0 }
      battlefields:
        - { id: bf1, controller: null, units: { A: ["@unit(might:3)#u1"], B: [] } }
      chain: []
    commands:
      - { player: A, do: pass }
      - { player: B, do: move, unit: "#d1", to: bf1 }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: unit.moved, object: "#d1", to: bf1 }
          - { timing: combat.staged, battlefield: bf1 }
          - { timing: combat.opened, battlefield: bf1, attacker: A, defender: B }
      state:
        - { path: "turn.focus", equals: A }
        - { path: "turn.state", equals: showdown-open }
      rejected: null
    notes: "战斗在有 Showdown 进行中的战场 staged 时，清理（1.5:323.13）把当前 Showdown 转为战斗 Showdown；战斗在已进行的 Showdown 中开启时，持焦点方保持焦点（1.5:466.2.c.1.b），焦点不归还给攻击方。"

  - id: combat-negative-nonfocus-player-cannot-play
    rule: ["1.5:347.1"]
    title: "非持焦点玩家在 Showdown 开放态不能打出牌"
    kind: negative
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 1, runes: { ready: [fury], exhausted: [] }, hand: ["@spell(cost:1,domain:fury,speed:reaction,text:'Deal 1 to a unit.')"], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
      - { player: B, do: play, card: "hand[0]", pay: { energy: 1, power: [fury] } }
    expect:
      events: { ordered: subsequence, list: [] }
      state:
        - { path: "players.B.hand", equals: ["@spell(cost:1,domain:fury,speed:reaction,text:'Deal 1 to a unit.')"] }
      rejected: { command: 0, reason: "no-focus" }
    notes: "Showdown 中只有持焦点的玩家可以打出合法时机的牌或启动能力（1.5:347.1）；Open 状态只表示窗口开放，不代表任何玩家都能行动。"

  # ===== 战斗伤害分配与结算顺序 =====
  - id: combat-assign-full-lethal-before-spreading
    rule: ["1.5:467.2.c.3", "1.5:142.4.b"]
    title: "必须先给一个单位分配满额致命伤害，才能把剩余伤害分给另一个单位"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:5)#u1"], B: ["@unit(might:3)#d1", "@unit(might:3)#d2"] } }
      chain: []
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
      - { player: A, do: assign-damage, assignments: { "#d1": 3, "#d2": 2 } }
      - { player: B, do: assign-damage, assignments: { "#u1": 6 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: showdown.closed, battlefield: bf1, kind: combat }
          - { timing: combat.damage-assigned, player: A, to: "#d1", amount: 3 }
          - { timing: combat.damage-assigned, player: A, to: "#d2", amount: 2 }
          - { timing: combat.damage-dealt, to: "#d1", amount: 3 }
          - { timing: combat.damage-dealt, to: "#d2", amount: 2 }
      state:
        - { path: "battlefields.bf1.units.B", equals: [] }
      rejected: null
    notes: "攻击方先分配（1.5:467.2.c）；3 点先杀满 3 力的 #d1，余 2 点才能给 #d2（1.5:467.2.c.3 的示例结构）；双方分配完毕后伤害同时结算（1.5:467.2.c.1.a）。防御方 6 点全部分给唯一目标 #u1（无其他单位可分，允许超过致命值）。"

  - id: combat-negative-cannot-spread-below-lethal
    rule: ["1.5:467.2.c.3"]
    title: "非法分配：未满额致命就把伤害铺给多个单位，指令被拒"
    kind: negative
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:5)#u1"], B: ["@unit(might:3)#d1", "@unit(might:3)#d2", "@unit(might:3)#d3", "@unit(might:3)#d4"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 2, "#d2": 1, "#d3": 1, "#d4": 1 } }
    expect:
      events: { ordered: subsequence, list: [] }
      state: []
      rejected: { command: 0, reason: "invalid-damage-assignment" }
    notes: "采用 467.2.c.3 规则示例的反面：5 点伤害面对四个 3 力单位，必须先给其中一个分满 3 点，禁止低于致命就铺开。"

  - id: combat-assign-capped-at-lethal-with-existing-damage
    rule: ["1.5:467.2.c.4"]
    title: "有其他未分单位时，单个单位最多分到致命值；已有伤害标记计入致命计算"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:5)#u1"], B: ["@unit(might:3,damage:1)#d1", "@unit(might:3,damage:1)#d2", "@unit(might:3,damage:1)#d3", "@unit(might:3,damage:1)#d4"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 2, "#d2": 2, "#d3": 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-assigned, player: A, to: "#d1", amount: 2 }
          - { timing: combat.damage-assigned, player: A, to: "#d2", amount: 2 }
          - { timing: combat.damage-assigned, player: A, to: "#d3", amount: 1 }
      state: []
      rejected: null
    notes: "每个 3 力单位已带 1 点伤害，最多只能再被分 2 点（1.5:467.2.c.4 的示例结构）；分 2+2+1 合法，给任何一个分 3 是非法的。"

  - id: combat-negative-assign-more-than-lethal
    rule: ["1.5:467.2.c.4"]
    title: "非法分配：还有其他单位可分时，给单个单位分配超过致命值的伤害"
    kind: negative
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:5)#u1"], B: ["@unit(might:3)#d1", "@unit(might:3)#d2"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 4, "#d2": 1 } }
    expect:
      events: { ordered: subsequence, list: [] }
      state: []
      rejected: { command: 0, reason: "invalid-damage-assignment" }
    notes: "#d2 仍可被分配时，#d1 最多只能被分到致命值 3；分 4 点超限，整个分配方案非法。"

  - id: combat-tank-forces-first-assignment
    rule: ["1.5:467.2.c.6", "1.5:815", "1.5:826"]
    title: "分配顺序须满足 Tank 最先、Backline 最后"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:5)#u1"], B: ["@unit(might:2,keywords:[tank])#d1", "@unit(might:2)#d2", "@unit(might:2,keywords:[backline])#d3"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 2, "#d2": 2, "#d3": 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-assigned, player: A, to: "#d1", amount: 2 }
          - { timing: combat.damage-assigned, player: A, to: "#d2", amount: 2 }
          - { timing: combat.damage-assigned, player: A, to: "#d3", amount: 1 }
      state: []
      rejected: null
    notes: "467.2.c.6 的示例结构：必须先给 Tank 单位分配，然后普通单位，最后才轮到 Backline 单位；分配事件顺序应体现 Tank→普通→Backline。"

  - id: combat-negative-bypass-tank-assignment
    rule: ["1.5:467.2.c.6", "1.5:815"]
    title: "非法分配：Tank 单位未被分配前就把伤害分给无能力单位"
    kind: negative
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:3)#u1"], B: ["@unit(might:2,keywords:[tank])#d1", "@unit(might:2)#d2"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d2": 2, "#d1": 1 } }
    expect:
      events: { ordered: subsequence, list: [] }
      state: []
      rejected: { command: 0, reason: "invalid-damage-assignment" }
    notes: "能遵守就必须遵守分配限制（1.5:467.2.c.6）：先给 #d2 分伤害、Tank 单位只分到非致命的 1 点，违反 Tank 的最先分配要求。"

  - id: combat-two-tanks-free-order-among-same-priority
    rule: ["1.5:467.2.c.7", "1.5:815.1.c.2"]
    title: "两个 Tank 单位同为最先优先级，可在它们之间任选顺序，但都先于普通单位"
    kind: positive
    given:
