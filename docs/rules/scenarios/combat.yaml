          - { timing: combat.damage-assigned, player: A, to: "#d2", amount: 1 }
      state: []
      rejected: null
    notes: "467.2.c.8 的示例结构（规则原文以真实卡 Caitlyn, Patrolling 被同时赋予 Tank 与 Backline 为例）：互斥要求只能满足其一；选择 Tank 则 #d1 最先分配。若把 #d1 排在两个普通单位之间则非法（两个要求都没满足）。"

  - id: combat-undamageable-unit-exempt-from-mandatory-assignment
    rule: ["1.5:467.2.c.10"]
