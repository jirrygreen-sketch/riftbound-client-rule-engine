          - { timing: combat.damage-dealt, to: "#d2", amount: 2 }
      state:
        - { path: "battlefields.bf1.units.B", equals: ["@unit(might:2,text:'I do not take damage.')#d1"] }
      rejected: null
    notes: "467.2.c.10 的示例结构（规则原文以真实卡 Kayn, Unleashed 为例）：不能承受伤害的单位被忽略、不参与致命分配约束；攻击方可以把全部伤害分给 #d2 而完全不碰 #d1。"

  - id: combat-damage-dealt-simultaneously-shared-deathknell
    rule: ["1.5:467.2.c.1.a", "1.5:467.2.d", "1.5:808.2", "1.5:808.2.a", "1.5:808.1.d.2"]
    title: "分配与结算分离：双方伤害同时结算；同方多个 Deathknell 同时触发，操控者自选入链顺序"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:4)#u1"], B: ["@unit(might:2,text:'[Deathknell] Draw 1.')#d1", "@unit(might:2,text:'[Deathknell] Gain 1 energy next turn.')#d2"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 2, "#d2": 2 } }
      - { player: B, do: assign-damage, assignments: { "#u1": 4 } }
      - { player: B, do: choose-order, items: ["deathknell:#d2", "deathknell:#d1"] }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-dealt }
          - { timing: unit.killed, object: "#d1" }
          - { timing: unit.killed, object: "#d2" }
          - { timing: chain.item-pending, item: "deathknell:#d2" }
          - { timing: chain.item-pending, item: "deathknell:#d1" }
      state: []
      rejected: null
    notes: "伤害同时结算（467.2.d），双方单位同时进垃圾场；每个 Deathknell 实例各自触发（808.2），同一玩家同时入链多个触发时由操控者自选顺序（808.2.a），这里 B 把 #d2 的触发放在更靠近栈底。#u1 也被击杀（4 点致命）但无 Deathknell，不产生链项。"

  - id: combat-attacker-sums-might-defender-assigns-back
    rule: ["1.5:467.2.a", "1.5:467.2.b", "1.5:467.2.c"]
    title: "双方分别汇总己方总 Might，攻击方先分配，防御方随后反向分配"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:3)#u1", "@unit(might:2)#u2"], B: ["@unit(might:4)#d1"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 4 } }
      - { player: B, do: assign-damage, assignments: { "#u1": 3, "#u2": 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-assigned, player: A, to: "#d1", amount: 4 }
          - { timing: combat.damage-assigned, player: B, to: "#u1", amount: 3 }
          - { timing: combat.damage-assigned, player: B, to: "#u2", amount: 1 }
          - { timing: combat.damage-dealt }
      state:
        - { path: "battlefields.bf1.units.A", equals: ["@unit(might:2)#u2"] }
        - { path: "battlefields.bf1.units.B", equals: [] }
      rejected: null
    notes: "攻击方总 Might 3+2=5，其中 4 点按致命值分配给唯一目标 #d1（无其他单位可分时允许达到致命值，余 1 点无法再分）；防御方总 Might 4，先杀满 3 力的 #u1 再给 #u2 分 1 点。分配完毕后同时结算。"

  - id: combat-negative-might-sums-as-zero
    rule: ["1.5:143.2.c"]
    title: "负 Might 单位在战斗求和时按 0 计，不产生伤害分配额度"
    kind: edge
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:-2)#u1"], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
