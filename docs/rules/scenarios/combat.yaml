          - { timing: combat.damage-dealt, to: "#u1", amount: 2 }
      state:
        - { path: "battlefields.bf1.units.B", equals: ["@unit(might:2)#d1"] }
      rejected: null
    notes: "攻击方总 Might 按 0 计（负值在求和时视为 0，1.5:143.2.c），攻击方无任何可分配伤害；防御方 2 点正常击杀 #u1。被效果引用时按 0，但真实 Might 仍为 -2（供其他效果继续加减）。"

  - id: combat-prevent-and-doubling-apply-at-assignment-controller-orders
    rule: ["1.5:467.2.c.5"]
    title: "预防与翻倍等替代在分配阶段即生效，生效顺序由受影响单位的操控者选择"
    kind: edge
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:3)#u1"], B: ["@unit(might:2)#d1"] } }
      chain: []
      effects:
        - { on: "#d1", kind: prevent, amount: 2, scope: this-combat }
        - { on: "#d1", kind: double-damage-taken, scope: this-turn }
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 3 } }
      - { player: B, do: choose-order, items: ["prevent:#d1", "double:#d1"] }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-assigned, player: A, to: "#d1", amount: 3 }
          - { timing: combat.damage-dealt, to: "#d1", amount: 2 }
      state:
        - { path: "battlefields.bf1.units.B", equals: ["@unit(might:2)#d1"] }
      rejected: null
    notes: "467.2.c.5 的示例结构（规则原文提及真实卡 Counter Strike 式预防与真实卡 Lotus Trap 的翻倍）：先预防 2 再翻倍 1 到 2，分配额 3、实受 2，#d1 存活；若 B 选择先翻倍，则分配 3 翻倍为 6、再防 2，实受 4 会致命。替代只作用于分配、结算时不再重复计算。"

  - id: combat-assignment-accounts-for-doubling-minimum-applied
    rule: ["1.5:467.2.c.4.a"]
    title: "分配额经替代放大后只需满足放大后致命的最小投入"
    kind: edge
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
