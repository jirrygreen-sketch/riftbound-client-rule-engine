        - { id: bf1, controller: B, units: { A: ["@unit(might:3)#u1"], B: ["@unit(might:3)#d1", "@unit(might:3)#d2"] } }
      chain: []
      effects:
        - { on: "#d1", kind: double-damage-taken, scope: this-turn }
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 2, "#d2": 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-assigned, player: A, to: "#d1", amount: 2 }
          - { timing: combat.damage-dealt, to: "#d1", amount: 4 }
          - { timing: unit.killed, object: "#d1" }
      state: []
      rejected: null
    notes: "467.2.c.4.a 的示例结构：3 力单位带所受伤害翻倍，在其他单位仍可被分配时只能被分 1 或 2（2 翻倍为 4 即满足致命的最小投入），分配 3 属超额非法。"

  - id: combat-no-result-recalls-attackers-when-defenders-remain
    rule: ["1.5:468.1.a.2", "1.5:468.3.d", "1.5:468.3.d.1"]
    title: "伤害后防御方仍有单位：攻击方单位被召回，战斗无结果，重新 stage 战斗与 Showdown"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:3)#d1"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 2 } }
      - { player: B, do: assign-damage, assignments: { "#u1": 2 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-dealt }
          - { timing: unit.killed, object: "#u1" }
          - { timing: unit.healed, object: "#d1" }
          - { timing: combat.result-determined, battlefield: bf1, result: none }
          - { timing: showdown.staged, battlefield: bf1 }
          - { timing: combat.staged, battlefield: bf1 }
          - { timing: combat.opened, battlefield: bf1, attacker: A, defender: B }
      state:
        - { path: "battlefields.bf1.units.A", equals: [] }
        - { path: "players.A.base", equals: ["@unit(might:2)#u1"] }
      rejected: null
    notes: "战斗清理插入治疗所有单位（468.1.a.1）与防御方仍在场时召回攻击方单位（468.1.a.2）；#u1 已被杀故 A 无单位可召回，B 独存但因召回步骤规则规定为无结果（468.3.d），双方均在场时重新 stage，清理中再次开启战斗。UNCERTAIN: 468.3.d 的字面是“只要有攻击方单位在 3d 步骤被召回则无结果”；本场景 A 的唯一单位已死、无人被实际召回，此时是否仍按无结果处理，规则未给出单独示例，按防御方独存即守方成功守住、战斗重新 stage 理解。"

  - id: combat-attacker-wins-conquers-battlefield
    rule: ["1.5:468.3.a", "1.5:468.5", "1.5:468.5.d", "1.5:468.7.a"]
    title: "攻击方清空防御方：赢下战斗、建立控制、构成征服；战斗结束时移除攻防指定"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:4)#u1"], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 2 } }
      - { player: B, do: assign-damage, assignments: { "#u1": 2 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: unit.killed, object: "#d1" }
          - { timing: combat.result-determined, battlefield: bf1, winner: A }
          - { timing: battlefield.control-established, battlefield: bf1, player: A }
          - { timing: score.conquered, battlefield: bf1, player: A }
          - { timing: combat.ended, battlefield: bf1 }
      state:
        - { path: "battlefields.bf1.controller", equals: A }
        - { path: "battlefields.bf1.contested", equals: false }
        - { path: "players.A.score", equals: 1 }
        - { path: "battlefields.bf1.units.#u1.designation", equals: null }
      rejected: null
    notes: "唯一在场且拥有攻防指定的玩家赢下战斗（468.3.a）；防御方全部被消灭，召回步骤无对象，攻击方独存，建立控制并征服（本回合未在此得分）。战斗结束移除所有攻击/防御指定、本次战斗效果同时到期（468.7）。"

  - id: combat-both-sides-wiped-no-result-battlefield-uncontrolled
    rule: ["1.5:468.3.d", "1.5:468.5.b"]
    title: "双方同归于尽：无结果、无人在场，战场变为无人控制"
    kind: edge
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
