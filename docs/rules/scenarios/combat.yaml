      - { player: B, do: assign-damage, assignments: { "#u1": 2 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-dealt }
          - { timing: combat.result-determined, battlefield: bf1, result: none }
          - { timing: combat.ended, battlefield: bf1 }
      state:
        - { path: "battlefields.bf1.controller", equals: null }
        - { path: "players.A.score", equals: 0 }
        - { path: "players.B.score", equals: 0 }
      rejected: null
    notes: "双方均无单位剩余则无结果（468.3.d 尾段）；无单位在场则战场成为 Uncontrolled（468.5.b），无人得分。"

  - id: combat-heal-in-combat-cleanup-before-result
    rule: ["1.5:468.1.a.1", "1.5:143.3.b.2", "1.5:468.3"]
    title: "战斗清理先治疗所有单位再判定结果：带伤存活的防御方保持存活并赢得战斗"
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-closed, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:5)#d1"] } }
      chain: []
    commands:
      - { player: A, do: assign-damage, assignments: { "#d1": 2 } }
      - { player: B, do: assign-damage, assignments: { "#u1": 2 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-dealt }
          - { timing: unit.killed, object: "#u1" }
          - { timing: unit.healed, object: "#d1" }
          - { timing: combat.result-determined, battlefield: bf1, winner: B }
          - { timing: combat.ended, battlefield: bf1 }
      state:
        - { path: "battlefields.bf1.controller", equals: B }
        - { path: "battlefields.bf1.units.#d1.damage", equals: 0 }
      rejected: null
    notes: "战斗清理（特殊清理）插入治疗步骤：#d1 带着 2 点伤害存活，伤害被清掉后再判定结果；B 作为唯一在场方赢。B 已控制该战场，不发生控制权变化或征服。"

  - id: combat-staged-combat-fizzles-when-side-leaves
    rule: ["1.5:463.2", "1.5:323.9", "1.5:323.10"]
    title: "战斗开启前一方离场：staged 战斗取消；若争夺方仍无单位在场，争夺状态一并移除"
    kind: edge
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf2, focus: B }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 1, runes: { ready: [fury], exhausted: [] }, hand: ["@spell(cost:1,domain:fury,speed:reaction,text:'Kill a unit at a battlefield.')"], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: null, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#d1"] }, staged: [showdown, combat] }
        - { id: bf2, controller: null, units: { A: ["@unit(might:2)#u2"], B: [] } }
      chain: []
    commands:
      - { player: B, do: play, card: "hand[0]", target: "#d1", pay: { energy: 1, power: [fury] } }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "B:hand[0]" }
          - { timing: unit.killed, object: "#d1" }
          - { timing: combat.unstaged, battlefield: bf1 }
      state:
        - { path: "battlefields.bf1.units.B", equals: [] }
        - { path: "battlefields.bf1.contested", equals: true }
        - { path: "turn.state", equals: showdown-open }
      rejected: null
    notes: "bf1 的 staged 战斗在开启前不再有两方单位（#d1 被杀），战斗取消 staged（1.5:463.2/323.9）；A 在 bf1 仍有单位，争夺保留、其 staged 非战斗 Showdown 待当前 bf2 的 Showdown 结束后开启（323.9 只取消战斗）。UNCERTAIN: 323.9 只说战斗停止 staged；同一战场同时 staged 的非战斗 Showdown 是否保留，规则按 323.7.a 的字面（争夺仍在且施加方有单位则 Showdown 保持 staged）理解为保留。"

  - id: combat-negative-move-into-ongoing-combat-battlefield
    rule: ["1.5:316.7.d", "1.5:464", "1.5:464.1"]
    title: "非法移动：非参战方不能把单位移动进战斗进行中的战场"
    kind: negative
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        C: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:2)#c1"], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:3)#u1"], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
      - { player: C, do: move, unit: "#c1", to: bf1 }
    expect:
      events: { ordered: subsequence, list: [] }
      state:
        - { path: "players.C.base", equals: ["@unit(might:2)#c1"] }
      rejected: { command: 0, reason: "invalid-destination" }
    notes: "战斗只发生在恰好两名玩家之间（1.5:464）；有 staged 或进行中战斗的战场对未参战玩家的任何移动都是非法目的地（464.1）。二人局无第三玩家，故用三人局建模此约束。"

  - id: combat-deploy-gear-becomes-unit-stages-showdown-orianna
    rule: ["1.5:830", "1.5:143.5.b", "1.5:190.3.a", "1.5:323.11", "radiance-patch-notes"]
    title: "Deploy 装备被 Lady of Clockwork 变为单位：施加争夺，链清空后清理 stage 并开启战斗 Showdown"
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 1, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0, legend: "Lady of Clockwork" }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:2)#d1"] }, gear: { A: ["@gear(cost:2,keywords:[deploy])#g1"], B: [] } }
      chain: []
    commands:
      - { player: A, do: activate, source: "legend", target: "#g1", pay: { energy: 1 } }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "ability:legend" }
          - { timing: chain.item-resolved, item: "ability:legend" }
          - { timing: battlefield.contested, battlefield: bf1, by: A }
          - { timing: combat.staged, battlefield: bf1 }
          - { timing: combat.opened, battlefield: bf1, attacker: A, defender: B }
          - { timing: showdown.opened, battlefield: bf1, kind: combat }
          - { timing: focus.gained, player: A }
      state:
        - { path: "battlefields.bf1.units.A", equals: ["@gear(cost:2,keywords:[deploy])#g1"] }
        - { path: "battlefields.bf1.contested", equals: true }
      rejected: null
    notes: "真实卡：Lady of Clockwork（RAD-145，传奇；启动能力把己方装备变为 Might 等于其能量费的单位-装备）。官方裁定（Radiance patch notes）：触发结算后装备成为单位，若其操控者不控制该战场则施加争夺，随后的清理 stage 战斗/Showdown，链清空后开启。此处 bf1 有 B 的单位，故 stage 战斗并以战斗 Showdown 开启，A 为攻击方获得焦点。"

  - id: combat-attached-gear-becomes-unit-detaches
    rule: ["1.5:143.5.b", "1.5:435.1.h.2", "1.5:718.6.a", "radiance-patch-notes"]
    title: "已附着的装备被变成单位时立即脱离附着物"
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 1, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:3)#u1"], score: 0, legend: "Lady of Clockwork" }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: A, units: { A: [], B: [] } }
      chain: []
      attachments:
        - { card: "@gear(cost:1)#g1", attachedTo: "#u1" }
    commands:
      - { player: A, do: activate, source: "legend", target: "#g1", pay: { energy: 1 } }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: "ability:legend" }
          - { timing: attachment.detached, object: "#g1", from: "#u1" }
      state:
        - { path: "attachments", equals: [] }
      rejected: null
    notes: "真实卡：Lady of Clockwork（RAD-145）。v1.5 澄清规则：单位不能被附着；非单位对象成为单位时即刻脱离（143.5.b），官方 patch notes 同例。脱离不触发移动、不经过清理召回。"

  - id: combat-negative-attach-unit-noop
    rule: ["1.5:143.5.a", "1.5:718.6.a"]
    title: "试图把单位附着到对象上：什么都不发生"
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:2)#u1", "@unit(might:3)#u2"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: null, units: { A: [], B: [] } }
      chain: []
    commands:
      - { player: A, do: attach, card: "#u1", to: "#u2" }
    expect:
      events: { ordered: subsequence, list: [] }
      state:
        - { path: "attachments", equals: [] }
        - { path: "players.A.base", equals: ["@unit(might:2)#u1", "@unit(might:3)#u2"] }
      rejected: { command: 0, reason: "illegal-attach" }
    notes: "v1.5 澄清：若要把一个单位附着到永久物上，什么都不发生（143.5.a）。实现层面可在指令校验时直接拒绝（本场景按 negative 建模），也可让指令结算为空效果；规则文本的语义是 nothing happens。"

  - id: combat-deathknell-pending-before-trash
    rule: ["1.5:808.1.d.2", "1.5:808.1.d.3"]
    title: "Deathknell 触发先于死亡单位进垃圾场入链，并以入链时记录的信息结算"
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 2, runes: { ready: [fury, fury], exhausted: [] }, hand: ["@spell(cost:2,domain:fury,speed:action,text:'Kill a unit.')"], base: ["@unit(might:1)#uA"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:2,text:'[Deathknell] Deal damage equal to my Might to a unit.')#d1"], score: 0 }
      battlefields:
        - { id: bf1, controller: null, units: { A: [], B: [] } }
      chain: []
      effects:
        - { on: "#d1", kind: buff-might, amount: 2, scope: this-turn }
    commands:
      - { player: A, do: play, card: "hand[0]", target: "#d1", pay: { energy: 2, power: [fury, fury] } }
      - { player: B, do: choose, target: "#uA" }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "A:hand[0]" }
          - { timing: unit.killed, object: "#d1" }
          - { timing: chain.item-pending, item: "deathknell:#d1" }
          - { timing: zone.enter, object: "#d1", zone: trash }
          - { timing: chain.item-resolved, item: "deathknell:#d1" }
      state:
        - { path: "players.B.trash", equals: ["@unit(might:2,text:'[Deathknell] Deal damage equal to my Might to a unit.')#d1"] }
      rejected: null
    notes: "触发以 Pending 形态在牌进垃圾场之前入链（808.1.d.2）；入链前记录其位置、属性等供结算使用（808.1.d.3），本例中 #d1 死前带 +2 增益，结算时按记录的 4 力对 #uA 造成伤害。UNCERTAIN: 808.1.d.3 只说记录细节以便结算，是否锁定全部特征值（类似 Show Off 的锁定语义）规则未逐字写明，本场景按记录即锁定理解。"

  - id: combat-deathknell-removed-when-death-replaced
    rule: ["1.5:808.1.d.1"]
    title: "死亡被替代（改为召回/治疗）时，已入链的 Deathknell 触发被移除"
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 2, runes: { ready: [fury, fury], exhausted: [] }, hand: ["@spell(cost:2,domain:fury,speed:action,text:'Kill a unit.')"], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:2,text:'[Deathknell] Draw 1.')#d1"], score: 0 }
      battlefields:
        - { id: bf1, controller: null, units: { A: [], B: [] } }
      chain: []
      effects:
        - { on: "#d1", kind: replace-kill-with-recall, scope: this-turn }
    commands:
      - { player: A, do: play, card: "hand[0]", target: "#d1", pay: { energy: 2, power: [fury, fury] } }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: "A:hand[0]" }
          - { timing: chain.item-pending, item: "deathknell:#d1" }
          - { timing: unit.recalled, object: "#d1" }
          - { timing: chain.item-removed, item: "deathknell:#d1" }
      state:
        - { path: "players.B.trash", equals: [] }
        - { path: "players.B.hand", equals: [] }
      rejected: null
    notes: "808.1.d.1 的示例结构（规则原文以真实卡 Draven, Audacious 与真实卡 Zhonya's Hourglass 为例）：死亡事件被替代后单位未进垃圾场，其当我死亡触发虽曾入链，但会被从链上移除，效果不结算（B 不抽牌）。"

  - id: combat-disarm-single-trigger-on-attack
    rule: ["1.5:831.1.b", "1.5:831.1.d", "1.5:383.4.e.2"]
    title: "Disarm 是攻击触发：获得攻击方指定后入链，结算给敌方单位 -X 力"
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:2,keywords:[disarm:2])#u1"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:3)#d1"] } }
      chain: []
    commands:
      - { player: A, do: move, unit: "#u1", to: bf1 }
      - { player: A, do: choose, target: "#d1" }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.opened, battlefield: bf1, attacker: A, defender: B }
          - { timing: combat.attack-declared, object: "#u1" }
          - { timing: chain.item-pending, item: "disarm:#u1" }
          - { timing: chain.item-resolved, item: "disarm:#u1" }
      state:
        - { path: "battlefields.bf1.units.#d1.might", equals: 1 }
      rejected: null
    notes: "Disarm X 的功能文本是当我攻击时给此处一个敌方单位 -X 力本回合（831.1.d）；攻击触发在单位获得攻击方指定后作为 Pending 入链（383.4.e.2），经链结算后生效，故 3 力的 #d1 变为 1 力再进入伤害步骤。"

  - id: combat-disarm-multiple-instances-merge-sum
    rule: ["1.5:831.1.d.1", "1.5:831.2"]
    title: "同一单位多个 Disarm 来源合并为一次触发、数值相加（v1.5）"
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:2,keywords:[disarm:1])#u1", "@unit(might:2,keywords:[disarm:1])#u2"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:4)#d1"] } }
      chain: []
    commands:
      - { player: A, do: move, unit: "#u1", to: bf1 }
      - { player: A, do: move, unit: "#u2", to: bf1 }
      - { player: A, do: choose, target: "#d1" }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "disarm:#u1" }
          - { timing: chain.item-resolved, item: "disarm:#u1" }
          - { timing: chain.item-pending, item: "disarm:#u2" }
          - { timing: chain.item-resolved, item: "disarm:#u2" }
      state:
        - { path: "battlefields.bf1.units.#d1.might", equals: 2 }
      rejected: null
    notes: "831.2 的示例用真实卡 Clanging Sentry（RAD-055，你的 Mech 具有 Disarm）：第二张 Clanging Sentry 让两张都成为 Disarm 2（印刷 Disarm 1 加对方光环 1）。无论单位身上有多少个 Disarm 关键词，只触发一次、数值为总和（831.1.d.1）。本场景用合成卡复现同一结构：#u1、#u2 各带两个 Disarm 1 来源，各触发一次、每次 -2。"

  - id: combat-disarm-checked-once-per-combat
    rule: ["1.5:383.4.e.2.a"]
    title: "攻击触发每次战斗只检查一次：重新获得攻击方指定不再次触发 Disarm"
    kind: edge
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf1, focus: A }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:2,keywords:[disarm:2])#u1"], B: ["@unit(might:3)#d1"] } }
      chain: []
      combat: { battlefield: bf1, attacker: A, defender: B, attackTriggersChecked: ["#u1"] }
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
      - { player: A, do: assign-damage, assignments: { "#d1": 2 } }
      - { player: B, do: assign-damage, assignments: { "#u1": 2 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.damage-dealt }
          - { timing: combat.result-determined, battlefield: bf1, result: none }
          - { timing: combat.opened, battlefield: bf1, attacker: A, defender: B }
      state:
        - { path: "battlefields.bf1.units.#d1.might", equals: 3 }
      rejected: null
    notes: "同一场战斗（无结果后重新 stage 并再次开启，468.3.d.1）中单位再次获得攻击方指定；攻击触发条件每次战斗只检查一次（383.4.e.2.a），#u1 的 Disarm 在第一次获得指定时已检查过，不再入链（事件中不应出现第二个 disarm:#u1），#d1 保持 3 力。"

  - id: combat-disarm-first-attack-requirement-skipped
    rule: ["1.5:831.1.b", "1.5:383.4.e.2.b"]
    title: "被效果阻止攻击的单位不获得攻击方指定，其 Disarm 不触发"
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:2,keywords:[disarm:1])#u1"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:2)#d1"] } }
      chain: []
      effects:
        - { on: "#u1", kind: cannot-attack, scope: this-turn }
    commands:
      - { player: A, do: move, unit: "#u1", to: bf1 }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.opened, battlefield: bf1, attacker: A, defender: B }
      state:
        - { path: "battlefields.bf1.units.#d1.might", equals: 2 }
      rejected: null
    notes: "攻击触发条件在单位获得攻击方指定时检查（383.4.e.2.b），不能攻击的单位不获得该指定，Disarm 不触发、#d1 保持 2 力。UNCERTAIN: 不能攻击的效果在 v1.5 中是使单位不被赋予攻击方指定、还是获得指定但抑制触发，规则未给出逐字条目；本场景按不获得指定则不触发建模。"

  - id: combat-new-arrivals-gain-designation-next-cleanup
    rule: ["1.5:466.2.c.3.a", "1.5:323.2"]
    title: "战斗开启后到场的单位在下一次清理获得攻防指定，其攻击触发此时入链"
    kind: edge
    given:
      turn: { active: A, phase: main, state: showdown-open, battlefield: bf1, focus: A }
      players:
        A: { energy: 1, runes: { ready: [fury], exhausted: [] }, hand: ["@spell(cost:1,domain:fury,speed:reaction,text:'Move a friendly unit to a battlefield.')"], base: ["@unit(might:2,text:'When I attack, draw 1.')#u2"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", target: "#u2", to: bf1, pay: { energy: 1, power: [fury] } }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: "A:hand[0]" }
          - { timing: unit.moved, object: "#u2", to: bf1 }
          - { timing: combat.attack-declared, object: "#u2" }
          - { timing: chain.item-pending, item: "trigger:#u2" }
      state:
        - { path: "battlefields.bf1.units.#u2.designation", equals: attacker }
      rejected: null
    notes: "攻防指定在战斗开启时赋予在场单位；之后才到场的单位在下一次清理中获得与其操控者一致的指定（466.2.c.3.a，清理步骤 2，323.2），其攻击触发在获得指定时正常入链，每次战斗一次的计数从这次获得指定起算。"

  - id: combat-turn-player-chooses-which-combat-first
    rule: ["1.5:463.1", "1.5:323.12"]
    title: "多个战场同时有 staged 战斗：回合玩家选择先结算哪一个"
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: ["@unit(might:3)#u2"], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#d1"] }, staged: [combat] }
        - { id: bf2, controller: B, units: { A: [], B: ["@unit(might:3)#d2"] } }
      chain: []
    commands:
      - { player: A, do: move, unit: "#u2", to: bf2 }
      - { player: A, do: choose, battlefield: bf2 }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.staged, battlefield: bf2 }
          - { timing: combat.opened, battlefield: bf2, attacker: A, defender: B }
      state:
        - { path: "combat.battlefield", equals: bf2 }
      rejected: null
    notes: "bf1 的 staged 战斗先于本命令存在（同一清理中只开启一场战斗，462 要求无其他战斗进行中）。移动 #u2 后两个战场都有 staged 战斗，回合玩家选择先开 bf2（463.1/323.12）。"

  - id: combat-negative-unit-cannot-be-played-to-enemy-battlefield
    rule: ["1.5:355.2.a", "1.5:190.3.a.1"]
    title: "默认情况下单位不能打出到敌方控制的战场（无许可效果时拒绝）"
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A: { energy: 2, runes: { ready: [fury, fury], exhausted: [] }, hand: ["@unit(cost:2,might:2)"], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:2)#d1"] } }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: bf1, pay: { energy: 2 } }
    expect:
      events: { ordered: subsequence, list: [] }
      state:
        - { path: "players.A.energy", equals: 2 }
      rejected: { command: 0, reason: "invalid-destination" }
    notes: "单位打出的默认合法位置只有自己基地或自己控制的战场（355.2.a）；进入敌方战场需要效果授予许可（355.2.b）。战斗通过移动或效果产生的到场发生（190.3.a.1 同样适用于以其他方式到场）。"

  - id: combat-deploy-hold-kills-enemy-gear
    rule: ["1.5:830.1.b", "1.5:471.2", "1.5:315.2.b.2"]
    title: "对手固守在有其 Deploy 装备的战场时，该装备被消灭"
    kind: positive
    given:
      turn: { active: B, phase: beginning, state: neutral-open }
      players:
        A: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
        B: { energy: 0, runes: { ready: [], exhausted: [] }, hand: [], base: [], score: 0 }
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:2)#d1"] }, gear: { A: ["@gear(cost:2,keywords:[deploy])#g1"], B: [] } }
      chain: []
    commands:
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: score.held, battlefield: bf1, player: B }
          - { timing: unit.killed, object: "#g1" }
          - { timing: zone.enter, object: "#g1", zone: trash }
      state:
        - { path: "battlefields.bf1.gear.A", equals: [] }
        - { path: "players.A.trash", equals: ["@gear(cost:2,keywords:[deploy])#g1"] }
      rejected: null
    notes: "Deploy 的功能文本包含当对手在此固守时消灭此装备（830.1.b）。B 在回合开始阶段固守 bf1 时，A 部署在此的 Deploy 装备被消灭进其拥有者垃圾场。这是 v1.5 新增 Deploy 关键词与固守（得分）流程的交汇点。"
