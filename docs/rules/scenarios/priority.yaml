  # ---------- FEPR 与连续 Pass ----------
  - id: priority-finalizing-does-not-pass-priority
    rule: ["1.5:337.1.a"]
    title: Finalize 链项不传递优先权
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: pending }
      priority: null
    commands:
      - { player: A, do: finalize, item: c1, pay: { energy: 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: c1 }
          - { timing: priority.granted, player: A }
      state:
        - { path: "priority.holder", equals: A }
    notes: 337.1.a：Finalize 本身不传递优先权；Finalize 完后若无其他 Pending，由链上下一项（此处即 c1 自身）的控制者 A 获得优先权（337.4）。

  - id: priority-oldest-pending-finalizes-first
    rule: ["1.5:337.1.b"]
    title: 多个 Pending 项按入链顺序（最旧优先）Finalize
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: pending }
        - { id: c2, controller: B, card: "@spell(speed:reaction)", status: pending }
    commands:
      - { player: A, do: finalize, item: c1, pay: { energy: 1 } }
      - { player: B, do: finalize, item: c2, pay: { energy: 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: c1 }
          - { timing: chain.item-finalized, item: c2 }
          - { timing: priority.granted, player: A }
    notes: 337.1.b：Finalize 顺序与入链顺序一致；c1 先 Finalize，c2 后 Finalize，然后链上下一项 c1 的控制者 A 获得优先权。

  - id: priority-unit-resolves-on-finalize
    rule: ["1.5:337.2"]
    title: 单位链项 Finalize 后立即结算，不进入 Execute/Pass
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@unit(cost:2,might:3)", status: pending }
    commands:
      - { player: A, do: finalize, item: c1, to: base, pay: { energy: 2 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: c1 }
          - { timing: chain.item-resolved, item: c1 }
          - { timing: zone.enter, object: c1, zone: base }
    notes: 337.2：单位、装备、加资源类能力在 Finalize 后直接跳到 Resolve，不给对手反应窗口。

  - id: priority-add-ability-resolves-on-finalize
    rule: ["1.5:337.2"]
    title: 加资源类能力 Finalize 后立即结算
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@ability(adds-resources)", status: pending }
    commands:
      - { player: A, do: finalize, item: c1 }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: c1 }
          - { timing: chain.item-resolved, item: c1 }
    notes: 337.2：Adds resources 的能力与单位/装备一样 Finalize 即结算。

  - id: priority-newest-finalized-resolves-first
    rule: ["1.5:340.1"]
    title: 最新的 Finalized 链项先结算
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
        - { id: c2, controller: B, card: "@spell(speed:reaction)", status: finalized }
      priority: A
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: c2 }
          - { timing: chain.item-resolved, item: c1 }
    notes: 340.1：全体连续 Pass 后最新的 Finalized 项 c2 先结算，结算后链不空且无 Pending，由最新剩余项 c1 的控制者 A 再获优先权（340.4），再次连续 Pass 后 c1 结算。

  - id: priority-resolve-after-all-pass
    rule: ["1.5:339.1"]
    title: 所有玩家连续 Pass 后进入 Resolve 步
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
      priority: A
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: priority.passed, player: A }
          - { timing: priority.passed, player: B }
          - { timing: chain.item-resolved, item: c1 }
      state:
        - { path: "chain.length", equals: 0 }
        - { path: "turnState.state", equals: neutral-open }
    notes: 339.1：两人局 A、B 顺序连续 Pass 即满足“所有玩家连续 Pass”，最新 Finalized 项结算。

  - id: priority-priority-returns-after-resolve
    rule: ["1.5:340.4"]
    title: 链项结算后链仍不空时，最新剩余项控制者获得优先权
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,speed:reaction)" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
        - { id: c2, controller: B, card: "@spell(speed:reaction)", status: finalized }
      priority: A
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: c2 }
          - { timing: priority.granted, player: A }
      state:
        - { path: "chain.length", equals: 1 }
        - { path: "priority.holder", equals: A }
    notes: 340.4：c2 结算后链上剩 c1（无 Pending），由最新项 c1 的控制者 A 获得优先权，继续 FEPR Execute。

  - id: priority-passes-reset-when-item-added
    rule: ["1.5:339.1", "1.5:339.2"]
    title: 有玩家在 Pass 序列中加入新链项后，需重新连续 Pass
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,speed:reaction)" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: B, card: "@spell(speed:reaction)", status: finalized }
      priority: A
    commands:
      - { player: A, do: play, card: "hand[0]", to: chain, pay: { energy: 1 } }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "A:hand[0]" }
          - { timing: chain.item-finalized, item: "A:hand[0]" }
          - { timing: priority.passed, player: B }
          - { timing: priority.passed, player: A }
          - { timing: chain.item-resolved, item: "A:hand[0]" }
    notes: 339.2：A 没有 Pass 而是加新项，之前的 Pass 计数作废；新项 Finalize 后 B、A 需再次连续 Pass 才结算。

  - id: priority-showdown-ends-after-all-pass-focus
    rule: ["1.5:347.2.a", "1.5:348"]
    title: 对决中所有玩家连续 Pass Focus 后对决结束
    kind: positive
