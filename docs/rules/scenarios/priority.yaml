          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, contested: true, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#v1"] } }
      focus: A
      priority: A
      chain: []
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: focus.passed, player: A }
          - { timing: focus.passed, player: B }
          - { timing: showdown.closed, battlefield: bf1 }
      state:
        - { path: "turnState.showdown", equals: false }
    notes: 347.2.a/348：Showdown Open 中 A、B 连续 Pass，Showdown 结束；Combat Showdown 则进入战斗后续步骤（348.1）。

  - id: priority-noncombat-showdown-conquer
