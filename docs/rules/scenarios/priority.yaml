          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null, contested: true, units: { A: ["@unit(might:2)#u1"], B: [] } }
      focus: A
      priority: A
      chain: []
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: showdown.closed, battlefield: bf1 }
          - { timing: battlefield.control-established, battlefield: bf1, player: A }
      state:
        - { path: "battlefields.bf1.controller", equals: A }
    notes: 348.2.a：Non-Combat Showdown 结束时只有 A 有单位且尚未控制，则 A 建立控制；若本回合未在此计分则形成 Conquer（348.2.a.1）。

  - id: priority-combat-showdown-proceeds-to-damage
    rule: ["1.5:348.1"]
    title: 战斗对决连续 Pass 后进入战斗伤害等后续步骤
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, contested: true, combat: true, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#v1"] } }
      focus: A
      priority: A
      chain: []
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: showdown.closed, battlefield: bf1 }
          - { timing: combat.damage-step, battlefield: bf1 }
    notes: 348.1：Combat Showdown 全体 Pass 后进入战斗剩余步骤（伤害、结算），而非直接征服。

  - id: priority-turn-player-declares-end
    rule: ["1.5:305", "1.5:316.9"]
    title: 回合玩家在 Neutral Open 声明结束回合，主阶段结束
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: end-turn }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: phase.ended, phase: main }
          - { timing: phase.started, phase: ending }
    notes: 305/316.9：无链时回合玩家不再执行自由动作即可声明结束回合，进入 Ending Phase。

  - id: priority-simultaneous-triggers-turn-order
    rule: ["1.5:303.2.a", "patch:chronobreak"]
    title: 多名玩家同时向链上加项时按回合顺序排列，各自决定自己项的顺序
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
      triggers:
        - { owner: A, id: tA1 }
        - { owner: A, id: tA2 }
        - { owner: B, id: tB1 }
    commands: []
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: tA1 }
          - { timing: chain.item-pending, item: tA2 }
          - { timing: chain.item-pending, item: tB1 }
    notes: "303.2.a + Radiance patch notes（Chronobreak 示例）：同一时点触发、需同时入链的项按回合顺序以回合玩家开始排列，每位玩家内部顺序由其自选。UNCERTAIN: 若 A 的内部顺序选择 tA2 先于 tA1，序列应相应变化；此处按 A 自选顺序断言。"
