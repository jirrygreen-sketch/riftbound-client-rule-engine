    notes: "346.1：链由触发能力开启时，结算完回到 Open State 不触发 Focus 传递；A 仍持有 Focus。UNCERTAIN: 规则 346.1 明确“由触发能力开启的链”不传递 Focus，但多触发/Add 混合链是否按“最初开启者”判定，需 judge 确认。"

