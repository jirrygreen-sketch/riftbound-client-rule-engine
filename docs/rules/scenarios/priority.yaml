area: priority
rulesetVersion: core-1.5
sources:
  - "1.5:305"
  - "1.5:307-313"
  - "1.5:316.5.b"
  - "1.5:316.8"
  - "1.5:316.9"
  - "1.5:320.1"
  - "1.5:335"
  - "1.5:337-348"
  - "1.5:354.1"
  - "1.5:411.1-411.2"
  - "1.5:806"
  - "1.5:813"
  - "patch: https://playriftbound.com/en-us/news/announcements/core-rules-radiance-patch-notes-effective-october-16-2026/"
scenarios:
  # ---------- Turn State ----------
  - id: priority-neutral-open-default-main
    rule: ["1.5:305", "1.5:310.1", "1.5:312.2.a", "1.5:335"]
    title: 主阶段无链无对决时为 Neutral Open，回合玩家获得优先权
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands: []
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: priority.granted, player: A, reason: main-phase-neutral-open }
      state:
        - { path: "turnState.state", equals: neutral-open }
        - { path: "priority.holder", equals: A }
        - { path: "focus.holder", equals: null }
    notes: 对应 305/335：主阶段且无 Outstanding Task、无 Pending 链项、无对决/战斗时，回合玩家直接获得优先权。

  - id: priority-chain-exists-closes-state
    rule: ["1.5:309.1", "1.5:331.1", "1.5:354.1"]
    title: 卡牌一旦移入链（Pending）即形成链，回合进入 Closed State
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1)" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: chain, pay: { energy: 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "A:hand[0]" }
      state:
        - { path: "turnState.state", equals: neutral-closed }
        - { path: "chain.items[0].status", equals: pending }
    notes: 354.1：打出流程第 1 步把卡移入链，此时状态立刻转为 Closed；Pending 也算链项（329.1）。

  - id: priority-neutral-closed-no-showdown
    rule: ["1.5:310.2"]
    title: 无对决但有链时为 Neutral Closed
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 1
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
    commands: []
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "turnState.state", equals: neutral-closed }
        - { path: "turnState.showdown", equals: false }
        - { path: "chain.length", equals: 1 }
    notes: 310.2 的组合判定：只看 Showdown/Combat 与 Chain 两个维度。

  - id: priority-showdown-open-on-contested
    rule: ["1.5:310.3", "1.5:344.2", "1.5:345"]
    title: Contested 触发对决开始，进入 Showdown Open
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [], exhausted: [] }
          hand: []
          base: [ "@unit(might:2)#u1" ]
          score: 0
        B:
          energy: 1
          runes: { ready: [], exhausted: [] }
          hand: []
          base: [ "@unit(might:2)#v1" ]
          score: 0
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:2)#v1"] } }
      chain: []
    commands:
      - { player: A, do: move, object: "#u1", to: bf1 }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: combat.contested-applied, battlefield: bf1, by: A }
          - { timing: showdown.staged, battlefield: bf1 }
          - { timing: showdown.opened, battlefield: bf1 }
          - { timing: focus.granted, player: A }
          - { timing: priority.granted, player: A }
      state:
        - { path: "turnState.state", equals: showdown-open }
    notes: 344.2/345：玩家单位移动到敌方战场形成对峙，清理阶段标记 Staged 后开启对决；施加 Contested 的玩家获得 Focus（同时获得 Priority，313.2）。

  - id: priority-showdown-closed-during-chain
    rule: ["1.5:310.4"]
    title: 对决期间有人打出牌形成链，进入 Showdown Closed
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-open }
      players:
        A:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,speed:action)" ]
          base: []
          score: 0
        B:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, contested: true, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#v1"] } }
      focus: A
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: chain, pay: { energy: 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "A:hand[0]" }
      state:
        - { path: "turnState.state", equals: showdown-closed }
    notes: 310.4：Showdown 与 Chain 同时存在即为 Showdown Closed。

  - id: priority-no-chain-open-no-showdown-neutral
    rule: ["1.5:308.2", "1.5:309.2", "1.5:331.2", "1.5:343.2"]
    title: 无链且无对决时判定为 Neutral Open
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands: []
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "turnState.neutral", equals: true }
        - { path: "turnState.open", equals: true }
    notes: 308.2/309.2 的默认组合。

  - id: priority-focus-cleared-when-neutral
    rule: ["1.5:313.5"]
    title: 回合回到 Neutral State 时无人持有 Focus
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, contested: true, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#v1"] } }
      focus: A
      chain: []
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: showdown.closed, battlefield: bf1 }
      state:
        - { path: "turnState.showdown", equals: false }
        - { path: "focus.holder", equals: null }
    notes: 313.5：对决因双方连续 Pass 结束（347.2.a/348）后，回合回到 Neutral State，Focus 立即清空。

  # ---------- Priority 授予与传递 ----------
  - id: priority-no-priority-no-discretionary
    rule: ["1.5:312.1.b"]
    title: 无人持有优先权时双方都不能执行自由动作
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1)" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: pending }
      priority: null
    commands:
      - { player: B, do: play, card: "hand[0]", to: chain }
    expect:
      rejected: { command: 0, reason: "no-priority" }
      events:
        ordered: subsequence
        list: []
    notes: 312.1.b：优先权不存在时（例如 Pending 项尚未 Finalize 完），任何玩家都不能执行自由动作；312.1.b.1 的 Limited Action 不受影响。

  - id: priority-non-turn-player-no-priority-neutral-open
    rule: ["1.5:312.2.a", "1.5:316.5.b"]
    title: Neutral Open 的主阶段只有回合玩家获得优先权
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1)" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: B, do: play, card: "hand[0]", to: chain, pay: { energy: 1 } }
    expect:
      rejected: { command: 0, reason: "not-your-priority" }
    notes: 312.2.a/316.5.b：Neutral Open 下优先权只给回合玩家，非回合玩家不能行动。

  - id: priority-next-chain-controller-gains-priority
    rule: ["1.5:312.2.c", "1.5:337.4"]
    title: 所有 Pending 项 Finalize 完后，链上下一项的控制者获得优先权
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,speed:reaction)" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
        - { id: c2, controller: B, card: "@spell(speed:reaction)", status: pending }
    commands:
      - { player: B, do: finalize, item: c2, pay: { energy: 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: c2 }
          - { timing: priority.granted, player: A }
      state:
        - { path: "priority.holder", equals: A }
    notes: 337.4：B 的 Pending 项 Finalize 后无其他 Pending，链上下一项（c1）的控制者 A 获得优先权，进入 FEPR 的 Execute 步。

  - id: priority-priority-passes-in-turn-order
    rule: ["1.5:312.2.d", "1.5:338.1.b.1"]
    title: 有优先权的玩家 Pass，优先权交给回合顺序的下一位
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,speed:reaction)" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
      priority: A
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: priority.passed, player: A }
          - { timing: priority.granted, player: B }
      state:
        - { path: "priority.holder", equals: B }
    notes: 338.1.b.1：Pass 将优先权按回合顺序传给下一位；本例两人局即 A→B。

  - id: priority-priority-taken-not-created
    rule: ["1.5:312.3"]
    title: 授予优先权时若已有人持有则从对方手中夺取
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
      priority: A
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: priority.passed, player: A }
          - { timing: priority.passed, player: B }
          - { timing: chain.item-resolved, item: c1 }
      state:
        - { path: "priority.holder", equals: A }
    notes: 312.3：B Pass 后全体连续 Pass，c1 结算、链清空回到 Open；主阶段优先权再次授予时是从无人持有“创建”出来给回合玩家 A，而不是 B 继续保留。

  - id: priority-awaken-phase-no-priority
    rule: ["1.5:312.2.a", "1.5:335"]
    title: 觉醒阶段不授予优先权
    kind: negative
    given:
      turn: { active: A, phase: awaken, state: neutral-open }
      players:
        A:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1)" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: chain, pay: { energy: 1 } }
    expect:
      rejected: { command: 0, reason: "not-your-priority" }
    notes: 335：主阶段以外的阶段若无 Outstanding Task 与 Pending 链项，流程直接进入下一步，不授予优先权；312.2.a 也限定为“在其主阶段”。

  - id: priority-no-priority-during-cleanup
    rule: ["1.5:320.1"]
    title: 清理阶段进行时不授予或传递优先权与焦点
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-closed }
      players:
        A:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,speed:reaction)" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: pending }
      cleanup: in-progress
      priority: null
    commands:
      - { player: A, do: play, card: "hand[0]", to: chain, pay: { energy: 1 } }
    expect:
      rejected: { command: 0, reason: "no-priority" }
    notes: 320.1：清理阶段中可以新增 Pending 项，但不能 Finalize、不能结算，也不授予/传递优先权与焦点，因此此时无人能执行自由动作。

  # ---------- Focus ----------
  - id: priority-contested-player-gains-focus
    rule: ["1.5:345"]
    title: 对决开始时施加 Contested 的玩家获得 Focus
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: [ "@unit(might:2)#u1" ]
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:2)#v1"] } }
      chain: []
    commands:
      - { player: A, do: move, object: "#u1", to: bf1 }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: focus.granted, player: A, reason: applied-contested }
      state:
        - { path: "focus.holder", equals: A }
    notes: 345：对决开始时由施加 Contested 状态的玩家获得 Focus，与谁是回合玩家无关。

  - id: priority-gaining-focus-grants-priority
    rule: ["1.5:313.2", "1.5:312.2.b"]
    title: 获得 Focus 的玩家同时获得 Priority
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, contested: true, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#v1"] } }
      focus: A
      chain: []
    commands: []
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: priority.granted, player: A, reason: gained-focus }
      state:
        - { path: "priority.holder", equals: A }
        - { path: "focus.holder", equals: A }
    notes: 313.2/312.2.b：Showdown State 中获得 Focus 的同时即获得 Priority。

  - id: priority-pass-priority-retains-focus
    rule: ["1.5:313.3"]
    title: 玩家 Pass 优先权后仍保留 Focus
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-closed }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, contested: true, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#v1"] } }
      focus: A
      priority: A
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: priority.passed, player: A }
          - { timing: priority.granted, player: B }
      state:
        - { path: "focus.holder", equals: A }
        - { path: "priority.holder", equals: B }
    notes: 313.3：Showdown Closed 中 A Pass 优先权给 B，但 Focus 仍留在 A；若链清空回到 Showdown Open，按 340.2.a/346 处理 Focus 传递。

  - id: priority-focus-needs-priority-to-act
    rule: ["1.5:313.4"]
    title: 只有 Focus 没有 Priority 时不能执行自由动作
    kind: negative
    given:
      turn: { active: A, phase: main, state: showdown-closed }
      players:
        A:
          energy: 3
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,speed:reaction)" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, contested: true, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#v1"] } }
      focus: A
      priority: B
      chain:
        - { id: c1, controller: B, card: "@spell(speed:reaction)", status: finalized }
    commands:
      - { player: A, do: play, card: "hand[0]", to: chain, pay: { energy: 1 } }
    expect:
      rejected: { command: 0, reason: "not-your-priority" }
    notes: 313.4：Focus 本身不足以行动，必须同时持有 Priority；A 有 Focus 但优先权在 B，A 不能打出。

  - id: priority-chain-resolution-passes-focus
    rule: ["1.5:340.2.a", "1.5:346", "1.5:347.1.b"]
    title: 对决中链结算完毕回到 Open State 时 Focus 传给下一位玩家
    kind: positive
    given:
      turn: { active: A, phase: main, state: showdown-closed }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, contested: true, units: { A: ["@unit(might:2)#u1"], B: ["@unit(might:2)#v1"] } }
      focus: A
      priority: B
      chain:
        - { id: c1, controller: A, card: "@spell(speed:reaction)", status: finalized }
    commands:
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: c1 }
          - { timing: focus.passed, player: A }
          - { timing: focus.granted, player: B }
          - { timing: priority.granted, player: B }
      state:
        - { path: "turnState.state", equals: showdown-open }
        - { path: "focus.holder", equals: B }
    notes: 346/340.2.a：对决中由玩家打出牌开启的链结算完、状态回到 Open 时，Focus 传给回合顺序下一位（此处 A→B），B 同时获得 Priority。

  - id: priority-triggered-chain-no-focus-pass
    rule: ["1.5:340.2.a", "1.5:346.1"]
    title: 由触发能力开启的链结算后 Focus 不传递
    kind: edge
