        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:4,text:当我 Mighty 时，我是 Yeti)#u1"
              - "@unit(might:2,text:我拥有你操控的单位的全部标签)#u2"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: bf1, pay: { energy: 2 }, targets: ["#u1"] }
      - { player: B, do: pass }
