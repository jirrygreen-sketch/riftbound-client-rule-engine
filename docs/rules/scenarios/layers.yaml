    notes: >-
      479.4.b 的官方例。效果记录的是"-1 [M] 直到回合结束"，而非"-4 [M]"。 意义在于：之后 #u1 再被 +2 buff 时，终值是 1+2=3，而不是 2+2-4=0→被 最低 1 兜住——快照值 -1 跟随效果全程。

  - id: layers-arithmetic-passive-set-to-five-not-snapshotted
