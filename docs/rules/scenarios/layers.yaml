      state:
        - { path: "battlefields.bf1.units.A[0].might", equals: 4 }
        - { path: "battlefields.bf1.units.B[0].might", equals: 4 }
      rejected: null
    notes: >-
      复刻 478.1.c 的官方 Siphon Power 例（v1.5 新增）。#a1 与 #b1 互相引用， 构成依赖环；按 478.1.c 找出环的最小对象集，逐层同时计算。每个单位 (4+1-1)=4 不满足 Mighty，条件 +5 不适用，最终双双 4 [M]。此场景同时钉住 479.4.e 的先加后减子层顺序在环内同样成立。UNCERTAIN: 官方例未说明环内"逐层同时" 在存在环外 buff（+1）与环外减值（-1）混合时的逐步中间态；断言只锚定 官方给出的终值 4 [M]，中间态留给实现。

  - id: layers-dependency-vs-timestamp-within-layer
