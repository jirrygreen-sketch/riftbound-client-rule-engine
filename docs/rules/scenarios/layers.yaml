scenarios:
  # ===========================================================================
  # 一、图层顺序与持续重算（475–478、479.1–479.4）
  # ===========================================================================

  - id: layers-fiora-buff-then-recheck-ability
    rule: ["1.5:478.3", "1.5:478.4", "1.5:479.3", "1.5:479.4"]
    title: Fiora 例：buff 在算术层生效后回查能力层，补上三个关键词
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 4
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:2,text:给目标友方单位 +1 [M] 直到回合结束)#s1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:4,text:当我 Mighty 时，我拥有 Deflect、Ganking、Shield)#u1"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: bf1, pay: { energy: 2 }, targets: ["#u1"] }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: "A:hand[0]" }
          - { timing: effect.applied, object: "#u1", detail: "might:+1" }
      state:
        - { path: "battlefields.bf1.units.A[0].might", equals: 5 }
        - { path: "battlefields.bf1.units.A[0].keywords", contains: ["deflect", "ganking", "shield"] }
      rejected: null
    notes: >-
      复刻官方 478.4 的 Fiora 例。算术层把 Might 提到 5 之后必须重查能力层， 条件型能力此刻才变得可适用。这是"每层序列完成后递归重评"（478.3）的核心用例。

  - id: layers-buff-removal-drops-conditional-abilities
    rule: ["1.5:478.4"]
    title: buff 被移除后重算图层，条件型关键词同时消失
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:2,text:驱散目标单位身上的全部临时修正)#s1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:4,text:当我 Mighty 时，我拥有 Deflect、Ganking、Shield)#u1 buff:+1"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: bf1, pay: { energy: 2 }, targets: ["#u1"] }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: "A:hand[0]" }
      state:
        - { path: "battlefields.bf1.units.A[0].might", equals: 4 }
        - { path: "battlefields.bf1.units.A[0].keywords", equals: [] }
      rejected: null
    notes: >-
      复刻 478.4 第二个例子（含防御战斗加成的退化路径）。效果失格与施加是两回事， 但每个效果在整轮计算中同样只施加一次（478.4）；buff 消失后从 6 [M] 三关键词 直接回到 4 [M] 无关键词，不经过中间态。

  - id: layers-copy-layer-precedes-trait-layer
    rule: ["1.5:479.1", "1.5:479.2"]
    title: 复制层先于特征层：被复制的原生特征可被同对象的特征层效果覆盖
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 4
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:2,domain:fury,keywords:[shield])#src"
              - "@unit(might:1,text:我是 @src 的复制；我是 chaos 领域)#u1"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "battlefields.bf1.units.A[1].domain", equals: "chaos" }
        - { path: "battlefields.bf1.units.A[1].might", equals: 2 }
        - { path: "battlefields.bf1.units.A[1].keywords", contains: ["shield"] }
      rejected: null
    notes: >-
      v1.5 把复制效果从特征层中独立出来（Radiance patch notes：Copy Effects layer added）。#u1 先经复制层获得 #src 的全部可复特征（含 fury 领域）， 再由自身的特征层效果把领域改成 chaos。若顺序反过来，#u1 最终会是 fury。

  - id: layers-trait-layer-before-ability-layer
    rule: ["1.5:479.2", "1.5:479.2.b", "1.5:479.3"]
    title: 特征层先于能力层：先获得 Yordle 标签，再被授予 Yordle 专属能力
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:1)#u1"
              - "@unit(might:2,text:其他友方单位是 Yordle)#u2"
              - "@unit(might:2,text:其他 Yordle 友方单位拥有 Vision)#u3"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "battlefields.bf1.units.A[0].tags", contains: ["yordle"] }
        - { path: "battlefields.bf1.units.A[0].keywords", contains: ["vision"] }
      rejected: null
    notes: >-
      扩写 479.2.b / 479.3.b 的官方例子。#u1 必须先（经 478.3 的递归）在特征层 拿到 Yordle 标签，能力层的 "Yordle 拥有 Vision" 才对它适用；一轮扫不完， 需要递归重评。

  - id: layers-arithmetic-increases-before-decreases
    rule: ["1.5:479.4.e", "1.5:479.4.e.1", "1.5:479.4.e.2"]
    title: 算术层内先加后减，加值不会被后面的减值吃掉顺序
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:3)#u1 buff:+2 debuff:-4"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "battlefields.bf1.units.A[0].might", equals: 1 }
      rejected: null
    notes: >-
      算术层固定先施加所有增加、再施加所有减少（479.4.e.1 / 479.4.e.2）。 本例结果（3+2-4=1）与"先减后加"相同，真正区分顺序的是带 min/max 限制的 快照场景（见 layers-siphon-power-mutual-dependency），本场景用于钉死子层顺序本身。

  - id: layers-copy-game-action-object-has-copied-traits-as-printed
    rule: ["1.5:446.3", "1.5:479.1.b.1"]
    title: v1.5：复制游戏动作生成的对象以被复制特征为自己的印刷特征，不经复制层
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:2,text:生成一个衍生物单位，它是目标单位的复制)#s1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A: [ "@unit(cost:3,might:4,domain:fury,text:打出时抽 1 张牌)#src" ]
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: bf1, pay: { energy: 2 }, targets: ["#src"] }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: "A:hand[0]" }
          - { timing: zone.enter, zone: bf1, detail: "copy-of:#src" }
      state:
        - { path: "battlefields.bf1.units.A[1].printed.might", equals: 4 }
        - { path: "battlefields.bf1.units.A[1].printed.cost", equals: 3 }
        - { path: "battlefields.bf1.units.A[1].printed.domain", equals: "fury" }
        - { path: "battlefields.bf1.units.A[1].copyEffectActive", equals: false }
      rejected: null
    notes: >-
      契约 3.4"复制图层"行与规则 446.3（Zilean 例）：作为复制被创造的对象没有 自己的印刷特征再被替换，它直接以被复制特征为印刷特征。因而它不占复制层的 处理配额，也不会因为"复制效果被移除"而还原——它根本没有复制效果。 v1.5 新增条款（Radiance patch notes：Copy game action added）。

  - id: layers-copy-effect-token-gains-copied-cost
    rule: ["1.5:185.3.a.2", "1.5:479.1.b"]
    title: 复制效果（非生成式复制）给无费用衍生物追加费用
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:0,text:衍生物)#tok copy-effect:->#src"
              - "@unit(cost:4,might:3)#src"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "battlefields.bf1.units.A[0].cost", equals: 4 }
      rejected: null
    notes: >-
      185.3.a.2 的官方例子（LeBlanc, Deceiver 的 Reflection 衍生物）：衍生物 天生没有费用，但复制效果在复制层把费用追加给它。与 layers-copy-game-action-object-has-copied-traits-as-printed 相对照： 那条是"生成为复制"（446.3），这条是"生成后施加复制效果"（479.1.b）。

  # ===========================================================================
  # 二、可复特征 vs 实际特征（479.1.b.1、479.1.c、206）
  # ===========================================================================

  - id: layers-copyable-traits-ignore-arithmetic-buffs
    rule: ["1.5:479.1.b.1", "1.5:479.1.c"]
    title: 复制只拿印刷/已复制的特征，不拿算术层的临时加值
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:2,text:生成一个衍生物单位，它是目标单位的复制)#s1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A: [ "@unit(cost:3,might:2)#src buff:+3" ]
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: bf1, pay: { energy: 2 }, targets: ["#src"] }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: "A:hand[0]" }
      state:
        - { path: "battlefields.bf1.units.A[0].might", equals: 5 }
        - { path: "battlefields.bf1.units.A[1].might", equals: 2 }
      rejected: null
    notes: >-
      479.1.c：可复特征与实际特征是两套东西。#src 当前 5 [M]（2 印刷 + 3 buff）， 复制体只能拿到印刷的 2。此场景防止实现把"当前值"误抄进复制结果。

  - id: layers-copy-of-copy-chains
    rule: ["1.5:479.1.b", "1.5:479.1.b.1"]
    title: 复制的复制：第二个复制体读到的是第一个复制体"已复制的"可复特征
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:0,text:衍生物 Reflection)#tok1 copy-effect:->#src"
              - "@unit(might:3,text:Honest Broker)#src"
              - "@unit(might:0,text:衍生物 Reflection)#tok2 copy-effect:->#tok1"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "battlefields.bf1.units.A[2].name", equals: "Honest Broker" }
        - { path: "battlefields.bf1.units.A[2].might", equals: 3 }
      rejected: null
    notes: >-
      复刻 479.1.b 的官方 LeBlanc / Mirror Image 例。479.1.b.1 明确：施加了复制 效果后，可复特征就是复制来的那套。三个同名单位并存（原版 + 两个复制衍生物）。

  - id: layers-trait-layer-append-not-copied
    rule: ["1.5:479.1.c", "1.5:479.2"]
    title: v1.5：复制之后再被特征层追加的标签，不会随复制传播
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:2,text:生成一个衍生物单位，它是目标单位的复制)#s1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:3)#src"
              - "@unit(might:2,text:其他友方单位是 Mech)#u9"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: bf1, pay: { energy: 2 }, targets: ["#src"] }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: "A:hand[0]" }
      state:
        - { path: "battlefields.bf1.units.A[0].tags", contains: ["mech"] }
        - { path: "battlefields.bf1.units.A[2].tags", contains: ["mech"] }
      rejected: null
    notes: >-
      Radiance patch notes 明确："Effects like the Mech tag appended by Experimental Hexplate in the trait-altering layer are not copied by copy effects." 复制在复制层取数时，#src 的 Mech 标签（特征层追加）尚不在其 可复特征里。复制体自己之后也会被 #u9 的特征层效果加成 Mech，所以断言的 是"经传播"不存在——两个 Mech 都来自 #u9 自身效果，而非复制。 区分点：若实现错误地在复制时快照了当前标签，复制体在 #u9 离场后仍会是 Mech；正确行为是 #u9 离场后两者同时失去 Mech。

  - id: layers-cost-references-printed-or-copied-cost
    rule: ["1.5:206", "1.5:479.1.b.1"]
    title: 费用参照用印刷（或复制来的）费用，无视打出时的增减
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 6
          runes: { ready: [], exhausted: [] }
          hand:
            - "@spell(cost:8,text:对目标单位造成 8 点伤害。本法术的能量费减少你操控单位中的最高 [M])#sky"
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:5,text:当你打出费用 5 或以上的法术时，给我 +3 [M] 直到回合结束)#lux"
            B: []
        - { id: bf2, controller: null }
        - id: bf3
          controller: B
          units:
            A: []
            B: [ "@unit(might:9)#tank" ]
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: bf3, pay: { energy: 3 }, targets: ["#tank"] }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "A:hand[0]" }
          - { timing: trigger.queued, source: "#lux" }
      state:
        - { path: "players.A.energy", equals: 3 }
      rejected: null
    notes: >-
      206 的官方 Sky Splitter / Lux 例。实际只付了 3（8 - 5），但参照费用时看印刷 费用 8，Lux 的触发照常进链。涉及图层是因为"印刷或复制后的费用"正是 479.1.b.1 定义的可复特征集合的成员；费用增减在算术层，不影响该参照。

  # ===========================================================================
  # 三、对象依赖（478.1.a / 478.1.b / 478.1.c）—— v1.5 新增
  # ===========================================================================

  - id: layers-object-dependency-pause-and-evaluate
    rule: ["1.5:478.1.a"]
