  - id: layers-ahri-discipline-stunned-one-might
    rule: ["1.5:479.4.e", "https://playriftbound.com/en-us/news/announcements/core-rules-radiance-patch-notes-effective-october-16-2026/"]
    title: Ahri 例（正面）：给 1 [M] 眩晕单位贴 Discipline 会触发敌方 Ahri
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 2
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:2,text:给目标友方单位 +2 [M] 直到回合结束)#disc" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: B
          units:
            A: [ "@unit(might:1)#u1 stunned" ]
            B:
              - "@unit(might:3,text:敌方单位在此被眩晕)#leona"
              - "@unit(might:2,text:当敌方单位被你操控对象的能力减少 [M] 时，抽 1 张牌)#ahri"
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", to: bf1, pay: { energy: 2 }, targets: ["#u1"] }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-finalized, item: "A:hand[0]" }
          - { timing: trigger.queued, source: "#ahri" }
      state:
        - { path: "battlefields.bf1.units.A[0].might", equals: 3 }
        - { path: "players.B.handCount", equals: 1 }
      rejected: null
    notes: >-
