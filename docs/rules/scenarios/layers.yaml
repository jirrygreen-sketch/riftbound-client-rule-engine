      复刻 481.1 的官方例。两个效果互为因果（施一个改变另一个的产出），按 481.1 无法确立依赖，退回 482 的时间戳顺序：被动的"升至 5"先存在先施加 （贡献 +1），后到的法术再施加但被自身"最高 5"快照为 +0，终值 5。 与 layers-dependency-vs-timestamp-within-layer 形成正反对照。

  - id: layers-inactive-text-loses-timestamp
    rule: ["1.5:482.2"]
    title: 规则文本转为 Inactive 会丢时间戳，重新激活时按新时间戳排队
    kind: edge
