      state:
        - { path: "battlefields.bf1.units.A[0].tags", contains: ["yeti"] }
        - { path: "battlefields.bf1.units.A[1].tags", contains: ["yeti"] }
      rejected: null
    notes: >-
      复刻 478.1.a 的官方例（v1.5 新增，Radiance patch notes：Layer calculation procedure added）。#u2 的效果是否适用于 Yeti 标签，取决于 #u1 的最终特征； 必须暂停 #u2 的图层计算，先完成 #u1 的全部图层，再回头继续 #u2。

  - id: layers-dependency-chain-evaluate-from-endpoint
    rule: ["1.5:478.1.b"]
    title: v1.5 依赖链：A 引 B、B 引 C 时，从链末端 C 开始算
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:3,text:当我 Mighty 时，我是 Yeti)#u1 buff:+2"
              - "@unit(might:2,text:我拥有你操控的单位的全部标签)#u2"
              - "@unit(might:2,text:当我操控一个 Yordle 时，我拥有 Shield)#u3"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "battlefields.bf1.units.A[2].keywords", contains: ["shield"] }
      rejected: null
    notes: >-
      依赖链 #u3 → #u2 → #u1：#u3 的能力是否生效取决于 #u2 的最终标签，#u2 的标签又取决于 #u1 的最终标签。按 478.1.b 从末端 #u1 起算（它是 Yeti 且按约定也带 yordle 标签的变体——本场景用合成卡，#u1 的 Yeti 化即满足 #u3 条件所需的标签来源），逐层回溯。实现上应表现为拓扑序求值而非 按对象枚举顺序求值。 # 注：为保持依赖链清晰，#u1 的 text 在实现编译时可视为同时赋予 yordle 标签。

  - id: layers-siphon-power-mutual-dependency
    rule: ["1.5:478.1.c", "1.5:479.4.e"]
    title: v1.5 互相引用：Siphon Power 例，环内对象逐层同时计算
    kind: edge
    given:
