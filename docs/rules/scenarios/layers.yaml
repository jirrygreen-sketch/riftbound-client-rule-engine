      rejected: null
    notes: >-
      与 layers-trait-layer-append-not-copied 同构，落在能力层：Shield 是 #aura 在能力层（479.3）追加的，不属于 #src 的可复特征；复制体的 Shield 只能来自 #aura 对"所有其他友方单位"的再次适用，而非复制。区分点同前：#aura 离场后 两者应同时失去 Shield；若 Shield 是复制来的，#aura 离场后复制体仍保留。

  - id: layers-svellsongur-copies-text-to-equipment
    rule: ["1.5:479.1.d"]
    title: Svellsongur 例：装备在复制层抄写所附着单位的规则文本
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:3,text:当我攻击时，抽 1 张牌)#u1 attachments:[#g1]"
              - "@gear(mightBonus:+0,text:当我被附着到单位时，把该单位的文本复制到我的效果文本，只要我仍附着于它)#g1 attached-to:#u1"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "battlefields.bf1.units.A[1].effectText", contains: "当我攻击时" }
      rejected: null
    notes: >-
      复刻 479.1.d 的官方 Svellsongur 例。带 "copy" 字样的效果归复制层，即使它 出现在装备上、即使它抄写的是规则文本——不要因为它"给能力"就归入能力层。 依赖的能力：Svellsongur（装备，附着时复制所附着单位的文本）。

  - id: layers-copied-token-gains-domain
    rule: ["1.5:185.3.b.1", "1.5:479.1.b"]
    title: 无领域衍生物经复制效果获得被复制对象的领域
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - id: bf1
          controller: A
          units:
            A:
              - "@unit(might:0,text:衍生物)#tok copy-effect:->#src"
              - "@unit(might:2,domain:fury)#src"
            B: []
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
