    notes: >-
      185.3.b.1：衍生物天生没有领域，可经图层效果获得。与 layers-copy-effect-token-gains-copied-cost（费用）并列为"复制层可给衍生物 追加的特征"的两个实例；费用与领域都在 479.2.a 的特征清单内。

