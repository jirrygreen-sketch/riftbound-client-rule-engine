
# =============================================================================
# area: layers —— v1.5 持续效果图层场景规格
#
# 覆盖：规则 475–482（图层体系：复制 → 特征 → 能力 → 算术、持续重算、
# 对象依赖、互相引用、同层依赖与时间戳）、143.2.c（负 [M] 判定）、
# 143.5 / 435.1.h / 718.6（单位不可附着）、446（复制游戏动作）、
# 185.3（衍生物经图层获得费用/领域）、206（参照印刷或复制后的费用）、
# 832.1.d（Show Off 锁定特征）、136–137 / 718.3–718.4（附着卡的能力/战力
# 加成所在图层），以及官方 Radiance patch notes（2026-10-16 生效）的
# Orianna 例、Primordial Roar 例、Ahri 例。
# =============================================================================
