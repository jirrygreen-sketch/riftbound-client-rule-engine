            B: [ "@unit(might:4,text:若此处有敌方 Mighty 单位，我拥有 +5 [M])#b1 buff:+1" ]
        - { id: bf2, controller: null }
      chain: []
    commands:
      - { player: C, do: play, card: "hand[0]", to: bf1, pay: { energy: 3 }, picks: ["bf1"] }
