# 规则场景规格：triggers（触发能力与替代效果）
# 依据：Core Rules v1.5（2026-10-09 更新，Radiance 2026-10-16 生效），
# 官方 Radiance patch notes（playriftbound.com 公告，Effective October 16, 2026）。
# 触发主体条款 382-407；替代效果 367-375；每回合频率限制 371/383.3.e/386；
# 离场信息/离场触发时序 383.2.c.* / 359.3.f.*；区域变更清除临时修改 124/124.1；
# 触发进链步骤 399-407（Pending -> Finalize -> Resolve）。
