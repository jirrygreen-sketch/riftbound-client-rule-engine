    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 2 }, to: base, showOff: decline }
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "A:hand[0]" }
          - { timing: chain.item-finalized, item: "A:hand[0]" }
      state:
        - { path: "players.A.base.count", equals: 1 }
      views:
        A: { "players.A.hand.#s1.#identity": identity }
        B: { "players.A.hand.#s1.#identity": face-down }
        spectator: { "players.A.hand.#s1.#identity": face-down }
      rejected: null
    notes: Show Off 是「you may」（832.1.c），决定权在 Finalize 时的控制者（832.1.c.2）。放弃时事件流完全没有 card.revealed，B 与观战者连「手牌里有一张单位」都不知道——Show Off 的放弃本身只产生公开可见的「未展示」事实。

  # ---------- 私密选择与反强迫 ----------
  - id: privacy-discard-choice-private-until-trash
    rule: ["1.5:423.1.a", "1.5:108.7.c", "1.5:108.2.d"]
    title: 弃牌者用私有信息选择弃哪张，对手只看到数量变化和最终公开结果
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:1,might:1)#h1", "@spell(cost:5,text:\"draw 3\")#h2" ]
          base: []
          score: 0
        B:
          energy: 1
          runes: { ready: [calm], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"target opponent discards 1\")" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: B, do: play, card: "hand[0]", pay: { energy: 1 }, targets: ["A"] }
      - { player: B, do: pass }
      - { player: A, do: pass }
      - { player: A, do: resolve-choice, item: "B:hand[0]", choose: { discard: "#h1" } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: zone.enter, object: "#h1", zone: trash }
      state:
        - { path: "players.A.hand.count", equals: 1 }
        - { path: "players.A.trash", contains: "#h1" }
      views:
        A: { "players.A.hand.#h2.#identity": identity, "players.A.trash.#h1.#identity": identity }
        B: { "players.A.hand.#h2.#identity": face-down, "players.A.trash.#h1.#identity": identity, "players.A.hand": count-only }
        spectator: { "players.A.hand.#h2.#identity": face-down, "players.A.trash.#h1.#identity": identity }
      rejected: null
    notes: "423.1.a 明确弃牌者「可使用私有信息」做选择——选择过程对 B 不可见，B 只在结果进入公开 Trash（108.2.d）时才知道弃的是 #h1；留在手牌的 #h2 对 B 仍是背面。事件流不应包含「A 考虑过 #h2」之类的选择痕迹。"

  - id: privacy-pick-from-private-zone-opponent-sees-result-only
    rule: ["1.5:355.10.a", "1.5:423.1.a", "1.5:108.7.c"]
    title: 从私密区域做的选择（pick/选择项）在执行前不外泄
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"look at the top 3 cards of your Main Deck, put one into your hand and recycle the rest\")" ]
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:1)#d1", "@unit(cost:2,might:2)#d2", "@spell(cost:1,text:\"draw 1\")#d3", "@gear(cost:1)#d4" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 } }
      - { player: A, do: pass }
      - { player: B, do: pass }
      - { player: A, do: resolve-choice, item: "A:hand[0]", choose: { take: "#d2", recycle: ["#d1", "#d3"] } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: "A:hand[0]" }
          - { timing: zone.enter, object: "#d2", zone: hand }
      state:
        - { path: "players.A.hand.count", equals: 1 }
        - { path: "players.A.mainDeck.count", equals: 3 }
      views:
        A: { "players.A.hand.#d2.#identity": identity }
        B: { "players.A.hand.#d2.#identity": face-down, "players.A.hand": count-only, "players.A.mainDeck": count-only }
        spectator: { "players.A.hand.#d2.#identity": face-down, "players.A.mainDeck": count-only }
      rejected: null
    notes: "查看（look）与挑选都在 A 的私密信息域内：B 只能看到「A 手牌数量 0→1、牌库数量 4→3」，看不到看了哪三张、拿走了哪张、回收了哪两张。本场景的「look+pick」属非公开区域选择，不构成目标（355.10.a），也不产生展示事件。UNCERTAIN: 规则在 425（Reveal 对所有人）与 437（Predict 仅自己看）之间没有逐字定义「look at N 张并取一张」的事件粒度，本场景按「无 card.revealed 事件、只有最终 zone.enter 公开」理解；被拿走牌的 zone.enter 事件对 B 不含身份。"

  - id: privacy-secret-quality-action-not-compelled
    rule: ["1.5:128.6", "1.5:128.6.a"]
    title: 效果要求从手牌放特定类型的牌进场时，玩家可拒绝且不算违规
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"play a unit from your hand, ignoring its costs\")", "@unit(cost:6,might:6)#h1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 } }
      - { player: A, do: pass }
      - { player: B, do: pass }
      - { player: A, do: resolve-choice, item: "A:hand[0]", choose: decline }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: "A:hand[0]" }
          - { timing: instruction.ignored, item: "A:hand[0]", reason: "private-choice-declined" }
      state:
        - { path: "players.A.hand.count", equals: 1 }
        - { path: "players.A.base.count", equals: 0 }
      views:
        A: { "players.A.hand.#h1.#identity": identity }
        B: { "players.A.hand.#h1.#identity": face-down, "players.A.hand": count-only }
        spectator: { "players.A.hand.#h1.#identity": face-down }
      rejected: null
    notes: "128.6 的例子正是本条：效果没说「可以」、玩家手里也确实有单位 #h1，但因指令指定了牌的类型（涉及私有信息质量），玩家可忽略该指令，忽略视为不可能（128.6.a）。B 不能从「A 拒绝了」反推 A 手里有没有单位——指令忽略是合法结果而非信息泄露。"

  - id: privacy-secret-quality-action-accepted-reveals-minimum
    rule: ["1.5:128.6", "1.5:108.1.b", "1.5:107.1.d"]
    title: 玩家选择执行私密质量动作时，只公开被放进场的那张牌
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"play a unit from your hand, ignoring its costs\")", "@unit(cost:6,might:6)#h1", "@unit(cost:1,might:1)#h2" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 } }
      - { player: A, do: pass }
      - { player: B, do: pass }
      - { player: A, do: resolve-choice, item: "A:hand[0]", choose: { play: "#h1" } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: zone.leave, object: "#h1", zone: hand }
          - { timing: zone.enter, object: "#h1", zone: base }
      state:
        - { path: "players.A.base.count", equals: 1 }
        - { path: "players.A.hand.count", equals: 1 }
      views:
        A: { "players.A.hand.#h2.#identity": identity, "players.A.base.#h1.#identity": identity }
        B: { "players.A.base.#h1.#identity": identity, "players.A.hand.#h2.#identity": face-down }
        spectator: { "players.A.base.#h1.#identity": identity, "players.A.hand.#h2.#identity": face-down }
      rejected: null
    notes: "同一指令若玩家选择执行，只公开被选的 #h1（进场即 Public，107.1.d）；未被选的 #h2 保持 Private。B 知道「A 手里至少还有一张牌」（数量）但不知道那是什么。UNCERTAIN: 规则未规定该效果是否要求玩家向对手证明「选的确实是单位」——按服务端权威校验理解，证明发生在服务端，投影不额外公开手牌。"

  - id: privacy-hand-not-targetable-pick-not-target
    rule: ["1.5:355.10.a", "1.5:355.10.a.1"]
    title: 「从手牌打出单位」不构成目标，无需也不能在目标阶段公开手牌
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"you may play a unit from your hand, ignoring its costs\")", "@unit(cost:3,might:3)#h1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "A:hand[0]" }
          - { timing: chain.item-finalized, item: "A:hand[0]" }
      state:
        - { path: "chain[0].targets.count", equals: 0 }
      views:
        A: { "players.A.hand.#h1.#identity": identity }
        B: { "players.A.hand.#h1.#identity": face-down, "chain[0].targets": empty }
        spectator: { "chain[0].targets": empty }
      rejected: null
    notes: 355.10.a 的例子：手牌是非公开区域，「you may play a unit from your hand」里的单位不是目标。链项 Finalize 阶段没有合法目标可公布，B 的投影中 targets 为空；选择发生在结算阶段且只公开结果。

  # ---------- 负例：任何视角拿到不该拿的信息都是缺陷 ----------
  - id: privacy-negative-opponent-view-must-not-contain-hand-identity
    rule: ["1.5:108.7.c", "1.5:128.4"]
    title: 负例：对手视角的任何快照/事件都不得携带手牌身份字段
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:2,might:2)#h1", "@spell(cost:1,text:\"draw 1\")#h2" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: [ "@gear(cost:1)#h3" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "players.A.hand.count", equals: 2 }
      views:
        B: { "players.A.hand.#h1.#identity": face-down, "players.A.hand.#h2.#identity": face-down, "players.A.hand": count-only }
        spectator: { "players.A.hand.#h1.#identity": face-down, "players.B.hand.#h3.#identity": face-down }
      rejected: null
    notes: 这是投影的验收负例：任何实现若在 B 或观战视角的状态快照、事件负载、错误消息里带出手牌身份（名称/费用/文本），本场景即失败。投影断言用 face-down 锁定「只看到背面」。

  - id: privacy-negative-spectator-view-equals-non-owner
    rule: ["1.5:128.4", "1.5:108.7.c", "1.5:107.3.f"]
    title: 负例：观战视角不得比「非控制者玩家」多看到任何私有面
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:1,might:1)#h1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: [], B: [] }, facedown: { A: [ "@spell(cost:1,keywords:[hidden],text:\"kill a unit\")#f1" ] } }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "battlefields.bf1.facedown.A.count", equals: 1 }
      views:
        A: { "players.A.hand.#h1.#identity": identity, "battlefields.bf1.#f1.#identity": identity }
        B: { "players.A.hand.#h1.#identity": face-down, "battlefields.bf1.#f1.#identity": face-down }
        spectator: { "players.A.hand.#h1.#identity": face-down, "battlefields.bf1.#f1.#identity": face-down }
      rejected: null
    notes: 观战者不是任何对象的拥有者或控制者，其视角必须是「最受限」视角：B 看不到的（A 的手牌、A 控制的背面牌），观战同样看不到。若实现给观战开了上帝视角，本场景失败。

  - id: privacy-negative-deck-top-never-in-projection
    rule: ["1.5:108.4.e", "1.5:128.3"]
    title: 负例：未被查看/展示的牌库顶牌对包括拥有者在内的所有视角都是 Secret
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: []
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:1)#d1", "@unit(cost:1,might:2)#d2" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "players.A.mainDeck.count", equals: 2 }
      views:
        A: { "players.A.mainDeck": count-only, "players.A.mainDeck[0].#identity": face-down }
        B: { "players.A.mainDeck": count-only }
        spectator: { "players.A.mainDeck": count-only }
      rejected: null
    notes: 牌库顺序是 Secret（108.4.e）——连拥有者 A 的客户端也不得收到牌库顶身份（128.3 任何玩家都不得看），这防止作弊客户端从投影里读未来。只有经 look/predict/reveal 等明确动作后，信息才在限定范围与限定时间内出现。

  - id: privacy-negative-error-message-must-not-leak-private-card
    rule: ["1.5:128.4", "1.5:108.7.c"]
    title: 负例：非法命令的错误反馈不得泄露私密牌信息
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:2,might:2)#h1" ]
          base: []
          score: 0
        B:
          energy: 1
          runes: { ready: [calm], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"deal 1 to a unit\")" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null, units: { A: ["@unit(might:2)#u1"], B: [] } }
      chain: []
    commands:
      - { player: B, do: play, card: "hand[0]", pay: { energy: 1 }, targets: ["A:hand[0]"] }
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "players.A.hand.count", equals: 1 }
        - { path: "players.B.energy", equals: 1 }
      views:
        B: { "players.A.hand.#h1.#identity": face-down }
        spectator: { "players.A.hand.#h1.#identity": face-down }
      rejected: { command: 0, reason: "illegal-target" }
    notes: B 尝试把 A 的手牌当目标属于非法（355.10.a，非公开区域里的对象不是目标）。拒绝原因只能是通用 illegal-target，不得在 reason 或事件负载里回显「A:hand[0] 是 @unit(might:2)」之类内容——错误通道也是信息通道。

  - id: privacy-negative-facedown-characteristics-not-in-events
    rule: ["1.5:811.5.a", "1.5:128.4"]
    title: 负例：背面牌离区展示前，事件负载不得提前携带其身份
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 1
          runes: { ready: [calm], exhausted: [] }
          hand: [ "@spell(cost:1,speed:reaction,text:\"return a facedown card to its owner's hand\")" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: [], B: [] }, facedown: { A: [ "@spell(cost:1,keywords:[hidden],text:\"deal 2 to a unit\")#f1" ] } }
      chain: []
    commands:
      - { player: B, do: play, card: "hand[0]", pay: { energy: 1 }, targets: ["#f1"] }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "B:hand[0]" }
      state:
        - { path: "battlefields.bf1.facedown.A.count", equals: 1 }
      views:
        B: { "battlefields.bf1.#f1.#identity": face-down }
        spectator: { "battlefields.bf1.#f1.#identity": face-down }
      rejected: null
    notes: "锁定事件顺序：B 的法术入链、目标锁定 #f1 时，#f1 对 B 仍是背面；#f1 的身份只允许出现在 422.4 规定的「换区展示」事件及其之后。若链项 Pending 事件就把目标身份展开给 B，等于提前泄露，本场景失败。B 可以合法地以「一张面朝下牌」为目标（355.9.a.3），不需要知道它是什么。"

  - id: privacy-negative-replay-view-matches-spectator
    rule: ["1.5:128.3", "1.5:128.4", "1.5:108.7.c"]
    title: 负例：游戏进行中的回放视角不得包含任何私密或秘密信息
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:1,might:1)#h1" ]
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:1)#d1" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"draw 1\")#h2" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: pass, note: "以 spectator 视角重放到当前状态（契约第 4 节：投影由重放得到）" }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "players.A.hand.count", equals: 1 }
      views:
        spectator: { "players.A.hand": count-only, "players.A.hand.#h1.#identity": face-down, "players.B.hand.#h2.#identity": face-down, "players.A.mainDeck": count-only }
      rejected: null
    notes: 契约第 4 节规定事件与投影由 journal 重放得到。进行中对局的观战/回放投影必须与 spectator 一致：双方手牌与牌库全隐藏。若重放链路为调试方便把权威状态直接下发，本场景失败。终局后的回放不受此限（422.4 游戏结束展示背面牌）。

  - id: privacy-draw-not-revealed-to-opponent
    rule: ["1.5:414.1", "1.5:108.7.c"]
    title: 抽牌只产生数量变化事件，内容不进对手视角
    kind: positive
    given:
      turn: { active: A, phase: draw, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: []
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:1)#d1", "@gear(cost:1)#d2" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: pass, note: "抽牌阶段游戏动作自动执行抽 1" }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: zone.leave, object: "#d1", zone: mainDeck }
          - { timing: zone.enter, object: "#d1", zone: hand }
      state:
        - { path: "players.A.hand.count", equals: 1 }
        - { path: "players.A.mainDeck.count", equals: 1 }
      views:
        A: { "players.A.hand.#d1.#identity": identity }
        B: { "players.A.hand.#d1.#identity": face-down, "players.A.hand.count": 1, "players.A.mainDeck": count-only }
        spectator: { "players.A.hand.#d1.#identity": face-down }
      rejected: null
    notes: "抽牌对 B 与观战者表现为「牌库数量 -1、手牌数量 +1」，事件负载中的 object 引用在他们的投影里必须替换为匿名引用（只有 A 的投影保留 #d1 身份）。"

  - id: privacy-mulligan-set-aside-not-revealed
    rule: ["1.5:117.1-117.3", "1.5:108.7.c", "1.5:108.4.e"]
    title: 调度置旁的牌不公开，回收洗入后牌库恢复 Secret
    kind: edge
    given:
      turn: { active: A, phase: setup, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: [ "@unit(cost:1,might:1)#h1", "@unit(cost:2,might:2)#h2", "@spell(cost:1,text:\"draw 1\")#h3", "@gear(cost:1)#h4" ]
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:3)#d1", "@unit(cost:1,might:4)#d2" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: mulligan, setAside: ["#h1", "#h2"] }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: zone.enter, object: "#d1", zone: hand }
          - { timing: zone.enter, object: "#d2", zone: hand }
          - { timing: deck.shuffled, player: A }
      state:
        - { path: "players.A.hand.count", equals: 4 }
      views:
        A: { "players.A.hand": faces }
        B: { "players.A.hand": count-only, "players.A.mainDeck": count-only }
        spectator: { "players.A.hand": count-only }
      rejected: null
    notes: "117.1-117.3：置旁→抽等量→回收置旁牌。被置旁的 #h1/#h2 全程不公开；新抽的 #d1/#d2 只有 A 可见；回收洗入后牌库重新完全 Secret。B 只能观察到「A 调度了 2 张」这一数量事实。UNCERTAIN: 117 条没有逐字写明「对手是否知道调度了几张」；按数量公开（108.7.e 手牌数公开、置旁与补抽的数量变化可观察）理解，B 可推出调度张数但看不到内容。"

  - id: privacy-runedeck-top-channel-reveals-on-board-only
    rule: ["1.5:108.5.d", "1.5:431.2", "1.5:107.1.d"]
    title: Channel 翻出符文库顶前其身份 Secret，进场后转为公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"channel 1 rune exhausted\")" ]
          base: []
          score: 0
          runeDeck: [ fury, calm ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 } }
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: zone.leave, object: "A:runeDeck[0]", zone: runeDeck }
          - { timing: zone.enter, object: "A:runeDeck[0]", zone: base }
      state:
        - { path: "players.A.runes.exhausted.count", equals: 2 }
      views:
        A: { "players.A.base.runes": faces }
        B: { "players.A.base.runes": faces, "players.A.runeDeck": count-only }
        spectator: { "players.A.base.runes": faces, "players.A.runeDeck": count-only }
      rejected: null
    notes: 符文库顺序 Secret（108.5.d）；channel 把顶牌带进基地后，它成为场上对象、身份公开（107.1.d、109）。信息转换发生在「进场」这一刻，之前任何视角（包括 A）都不应看到符文库顶是什么。

  - id: privacy-opponent-hand-count-across-moves
    rule: ["1.5:108.7.e", "1.5:108.7.c"]
    title: 连续行动中对手手牌数量逐步公开更新，内容始终不公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 2
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:1,might:1)", "@unit(cost:1,might:1)" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"draw 1\")#h1", "@spell(cost:1,text:\"draw 1\")#h2", "@spell(cost:1,text:\"draw 1\")#h3" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 }, to: base }
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 }, to: base }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: zone.enter, object: "A:hand[0]", zone: base }
          - { timing: zone.enter, object: "A:hand[0]", zone: base }
      state:
        - { path: "players.A.hand.count", equals: 0 }
        - { path: "players.A.base.count", equals: 2 }
      views:
        A: { "players.B.hand": count-only }
        B: { "players.A.hand": count-only, "players.A.base": faces }
        spectator: { "players.A.hand": count-only, "players.A.base": faces }
      rejected: null
    notes: "A 连打两张单位：每次手牌数量变化（2→1→0）对所有视角立即可见（108.7.e），进场的牌身份公开（107.1.d）；B 的三张手牌 #h1-#h3 全程身份不公开。数量信息是实时的、内容是受控的，两个通道不能混。"

  - id: privacy-base-runes-exhaustion-state-public
    rule: ["1.5:107.1.d", "1.5:109.2"]
    title: 基地符文的横置/重置状态对所有视角公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [calm] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "players.A.runes.ready.count", equals: 1 }
        - { path: "players.A.runes.exhausted.count", equals: 1 }
      views:
        A: { "players.A.runes": faces }
        B: { "players.A.runes": faces }
        spectator: { "players.A.runes": faces }
      rejected: null
    notes: 已进场符文的种类与横置状态属于场上公开状态（107.1.d、109.2）；观战者与对手都能看到 A 有 1 个就绪 fury、1 个横置 calm。注意与符文库（Secret）区分：同一名玩家的「库」与「场上符文」信息等级不同。
