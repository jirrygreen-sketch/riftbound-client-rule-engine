        B: { "battlefields.bf1.#f1.#identity": face-down, "battlefields.bf1.#f1.speed": absent }
        spectator: { "battlefields.bf1.#f1.#identity": face-down, "battlefields.bf1.#f1.speed": absent }
      rejected: null
    notes: "811.6.a 明确次回合 Reaction 授予「不是公开信息」：A 的投影里 #f1 显示可打出时机，B 与观战者的投影里 #f1 仍是没有任何特征字段的背面牌；合法性检查由服务端权威执行，不依赖 B 的投影。"

  - id: privacy-play-from-facedown-reveals-at-pending
    rule: ["1.5:811.1.c.3", "1.5:108.1.b"]
    title: 从面朝下打出时牌在入链瞬间公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: [], B: ["@unit(might:2)#u1"] }, facedown: { A: [ "@spell(cost:0,keywords:[hidden],text:\"kill a unit\")#f1(hiddenOnTurn:1)" ] } }
      chain: []
    commands:
      - { player: A, do: play, card: "#f1", from: facedown, pay: { energy: 0 }, targets: ["#u1"] }
