          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 2 }, to: base, showOff: ["#s1"] }
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
