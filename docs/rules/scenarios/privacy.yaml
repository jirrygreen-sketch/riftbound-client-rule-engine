    notes: "从背面打出会开链（811.1.c.3），入链瞬间身份成为 Public（108.1.b）；目标选择随链项公开，B 与观战者从此看到 #f1 的全部信息。"

  # ---------- 展示与查看 ----------
  - id: privacy-reveal-top-cards-all-views-then-secret-again
    rule: ["1.5:425.1", "1.5:425.1.a.3", "1.5:425.3", "1.5:108.4.e"]
    title: 展示牌库顶期间所有视角可见，效果结算后回到 Secret
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"reveal the top 2 cards of your Main Deck\")" ]
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:1)#d1", "@spell(cost:1,text:\"draw 1\")#d2", "@gear(cost:1)#d3" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 } }
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: "A:hand[0]" }
          - { timing: card.revealed, object: "#d1", audience: all }
          - { timing: card.revealed, object: "#d2", audience: all }
          - { timing: card.reveal-ended, object: "#d1" }
          - { timing: card.reveal-ended, object: "#d2" }
      state:
        - { path: "players.A.mainDeck.count", equals: 3 }
        - { path: "players.A.mainDeck[0]", equals: "#d1" }
      views:
        A: { "players.A.mainDeck": count-only }
        B: { "players.A.mainDeck": count-only }
        spectator: { "players.A.mainDeck": count-only }
      rejected: null
    notes: "展示期间（事件序列内）三视角都看到 #d1/#d2 身份；展示是临时状态而非区域（425.1.a），结算完成后两牌以原顺序回到牌库顶（425.3 示例），投影立刻恢复为 count-only。终态断言牌库顶仍是 #d1。"

  - id: privacy-revealed-card-stays-in-zone
    rule: ["1.5:425.1.a.2"]
    title: 展示中的牌仍留在原区域，触发以「从牌库展示」为条件的替换效应
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"reveal the top card of your Main Deck\")" ]
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:5,text:\"As I'm revealed from your Main Deck, Add 2 energy\")#d1", "@gear(cost:1)#d2" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 } }
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: card.revealed, object: "#d1", audience: all }
          - { timing: effect.replacement-applied, object: "#d1" }
          - { timing: resource.added, player: A, amount: 2 }
      state:
        - { path: "players.A.energy", equals: 2 }
        - { path: "players.A.mainDeck.count", equals: 2 }
      views:
        A: { "players.A.mainDeck": count-only }
        B: { "players.A.mainDeck": count-only }
        spectator: { "players.A.mainDeck": count-only }
      rejected: null
    notes: "425.1.a.2：展示中的牌仍是牌库顶牌，「As I'm revealed from your Main Deck」替换效应正常生效（加 2 能量）；展示结束牌不换区。投影上结算完成后 B 与观战者不再看到 #d1。UNCERTAIN: 该替换效应的收益时点（随展示动作立即执行还是入链）按 v1.5 替换效应改写动作执行理解，契约 3.5 也规定替代效果在动作执行前拦截。"

  - id: privacy-predict-look-owner-only
    rule: ["1.5:437.1", "1.5:437.1.a", "1.5:108.4.e"]
    title: Predict 查看牌库顶仅执行者可见，回收决定公开但内容不公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"Predict 2\")" ]
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:1)#d1", "@spell(cost:1,text:\"draw 1\")#d2", "@gear(cost:1)#d3" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 } }
      - { player: A, do: pass }
      - { player: B, do: pass }
      - { player: A, do: resolve-choice, item: "A:hand[0]", choose: { recycle: ["#d2"], keepOrder: ["#d1"] } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: "A:hand[0]" }
          - { timing: zone.enter, object: "#d2", zone: "mainDeck.bottom" }
      state:
        - { path: "players.A.mainDeck.count", equals: 3 }
        - { path: "players.A.mainDeck[0]", equals: "#d1" }
      views:
        A: { "players.A.mainDeck": count-only, "players.A.mainDeck[0].#identity": identity }
        B: { "players.A.mainDeck": count-only, "players.A.mainDeck[0].#identity": face-down }
        spectator: { "players.A.mainDeck": count-only, "players.A.mainDeck[0].#identity": face-down }
      rejected: null
    notes: "437.1 的「look」只授予执行者，不等于展示（425 要求所有玩家可见才算展示）。A 在结算中选择把 #d2 回收到底部、#d1 放回顶；B 与观战只能看到「牌库数量不变、发生过一次回收」，看不到看了哪两张、放了哪张到底。A 视角在效果结算窗口内可见 #d1/#d2，终态仍 count-only（顶牌身份保留在权威状态供后续验证）。"

  - id: privacy-reveal-hand-snapshot-later-draws-private
    rule: ["1.5:425.3.a", "1.5:425.3.a.1", "1.5:108.7.c"]
    title: 展示手牌是快照，之后抽到的牌不继承展示状态
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 2
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"reveal your hand\")", "@spell(cost:1,text:\"draw 1\")" ]
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:1)#d1" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 }, note: "展示手牌" }
      - { player: A, do: pass }
      - { player: B, do: pass }
      - { player: A, do: play, card: "hand[1]", pay: { energy: 1 }, note: "展示结束后抽 1" }
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: card.revealed, object: "A:hand[1]", audience: all }
          - { timing: zone.enter, object: "#d1", zone: hand }
      state:
        - { path: "players.A.hand.count", equals: 1 }
      views:
        A: { "players.A.hand.#d1.#identity": identity }
        B: { "players.A.hand.#d1.#identity": face-down, "players.A.hand": count-only }
        spectator: { "players.A.hand.#d1.#identity": face-down }
      rejected: null
    notes: "425.3.a.1：展示状态只施加在执行展示时区域内已有的牌；展示结束后抽到的 #d1 从未被展示，对 B 与观战保持背面。第一次展示时 A 手里只剩第二张法术（第一张已在链上），它被公开；#d1 则不在快照内。"

  - id: privacy-reveal-hand-includes-all-current-cards
    rule: ["1.5:425.3.a"]
    title: 不指定数量的展示手牌等于展示当前全部手牌
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:1,might:1)#h1", "@unit(cost:2,might:2)#h2", "@spell(cost:3,text:\"draw 2\")#h3" ]
          base: []
          score: 0
        B:
          energy: 1
          runes: { ready: [calm], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"choose an opponent and they reveal their hand\")" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: B, do: play, card: "hand[0]", pay: { energy: 1 }, targets: ["A"] }
      - { player: B, do: pass }
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: card.revealed, object: "#h1", audience: all }
          - { timing: card.revealed, object: "#h2", audience: all }
          - { timing: card.revealed, object: "#h3", audience: all }
      state:
        - { path: "players.A.hand.count", equals: 3 }
      views:
        A: { "players.A.hand.#h1.#identity": identity }
        B: { "players.A.hand.#h1.#identity": identity, "players.A.hand.#h2.#identity": identity, "players.A.hand.#h3.#identity": identity }
        spectator: { "players.A.hand.#h1.#identity": identity, "players.A.hand.#h3.#identity": identity }
      rejected: null
    notes: 425.3.a：不指定张数即「当前该区域内所有牌」。结算窗口内三视角都看到三张身份；结算结束后展示状态到期（425.1.a.3），手牌恢复 Private——投影快照应在 card.reveal-ended 后回到 count-only（本场景终态用 events 子序列锁定展示范围，views 断言窗口内的可见性）。

  - id: privacy-reveal-only-when-instructed
    rule: ["1.5:425.2", "1.5:425.2.a"]
    title: 没有游戏效果指示时不得主动执行 Reveal
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:1,might:1)#h1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: reveal, card: "hand[0]" }
    expect:
      events:
        ordered: subsequence
        list: []
      state:
        - { path: "players.A.hand.count", equals: 1 }
      views:
        A: { "players.A.hand.#h1.#identity": identity }
        B: { "players.A.hand.#h1.#identity": face-down }
        spectator: { "players.A.hand.#h1.#identity": face-down }
      rejected: { command: 0, reason: "reveal-not-instructed" }
    notes: 425.2.a：Reveal 是 Limited Action，只能由游戏效果指示；玩家主动提交的 reveal 命令必须被拒（投影不产生任何 card.revealed 事件）。

  - id: privacy-voluntary-show-not-reveal-no-trigger
    rule: ["1.5:425.2.b"]
    title: 玩家主动出示手牌不构成 Reveal，不触发展示触发
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:1,might:1)#h1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: [ "@unit(might:2,text:\"Whenever a card is revealed, draw 1\")#u1" ]
          score: 0
          mainDeck: [ "@gear(cost:1)" ]
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: show, card: "hand[0]", to: B }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: card.shown, object: "#h1", audience: B }
      state:
        - { path: "players.B.mainDeck.count", equals: 1 }
        - { path: "players.B.hand.count", equals: 0 }
      views:
        A: { "players.A.hand.#h1.#identity": identity }
        B: { "players.A.hand.#h1.#identity": identity }
        spectator: { "players.A.hand.#h1.#identity": face-down }
      rejected: null
    notes: "425.2.b：主动出示可以选择受众（只给 B），不算展示、不进链、不触发「当牌被展示时」（B 的 #u1 不触发、不抽牌）；观战者视角 #h1 仍是背面。引擎应发出 card.shown 而非 card.revealed，且受众字段限定 B。"

  - id: privacy-show-off-hand-card-only-not-hand
    rule: ["1.5:832.1.c", "1.5:832.1.b.1"]
    title: Show Off 只公开被展示的那张手牌，不公开整只手
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 2
          runes: { ready: [fury], exhausted: [] }
