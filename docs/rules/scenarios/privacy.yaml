        - { path: "players.A.base.count", equals: 1 }
        - { path: "players.A.hand.count", equals: 1 }
      views:
        A: { "players.A.hand.#s2.#identity": identity }
        B: { "players.A.hand.#s2.#identity": face-down, "players.A.hand": count-only }
        spectator: { "players.A.hand.#s2.#identity": face-down }
      rejected: null
    notes: "832.1.c 只授权从手牌展示满足条件的那个对象（#s1）；同在手牌的 #s2 全程保持 Private。事件流里只有 #s1 的 card.revealed，没有 #s2 的；#s1 展示后仍在手牌（Show Off 不移动它），其展示状态随链项结算结束而到期。"

  - id: privacy-show-off-declined-nothing-leaked
    rule: ["1.5:832.1.c", "1.5:832.1.c.2"]
    title: 放弃 Show Off 时不展示任何手牌内容
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 2
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:2,might:3,text:\"Show Off a unit\")", "@unit(cost:4,might:4)#s1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
