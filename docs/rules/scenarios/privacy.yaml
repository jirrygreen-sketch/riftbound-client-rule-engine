area: privacy
rulesetVersion: core-1.5
sources:
  - "1.5:107.1.d-107.4"        # 基地/战场/面朝下区/传奇区的信息等级
  - "1.5:108.1.b-108.7.e"      # 链/弃牌/英雄区/牌库/符文库/放逐/手牌的信息等级
  - "1.5:109-109.2"            # 场上游戏对象及其状态公开
  - "1.5:128-128.6.a"          # 隐私三等级与私有信息反强迫
  - "1.5:323.6.a"              # 清理移除失控战场的面朝下牌
  - "1.5:355.10.a-355.10.a.1"  # 非公开区域内的选择不构成目标
  - "1.5:422.1-422.4"          # Hide；面朝下牌换区或游戏结束时向所有人展示
  - "1.5:423.1.a"              # 弃牌者可用私有信息选择弃哪张
  - "1.5:425.1-425.4.a"        # 展示：临时状态、区域不变、限于效果指示、主动出示不算展示
  - "1.5:437.1-437.4.a"        # Predict：查看牌库顶并选择是否回收
  - "1.5:811.1-811.6.a"        # Hidden 关键词与面朝下牌的权限
  - "1.5:832.1.b-832.1.d.1"    # Show Off：打出时从手牌展示对象
# views 用法（本章扩展字段，格式冻结文件允许）：
#   expect.views 按视角断言投影：A / B 为座位视角，spectator 为观战视角，回放视角与 spectator 同级处理。
#   每个视角是 路径 -> 期望 的映射：
#     绝对路径（如 "players.B.hand"）断言该视角投影后的整个区域：
#       "count-only" 只看到数量看不到身份；"faces" 能看到牌面；"empty" 投影后为空；
#       列表字面量 断言可见身份集合（如 [hidden-card] 表示只看到一个无名背面）。
#     带对象锚点的键（如 "battlefields.bf1.#f1.#identity"）断言该锚点对象在该视角下的可见面：
#       "identity" 可见完整身份；"face-down" 只看到背面（无身份、无可引用特征）；"absent" 该对象不出现在此视角。
#   投影断言的是「该视角收到的信息」，不含权威状态。
scenarios:
  # ---------- 区域信息等级 ----------
  - id: privacy-hand-faces-private-count-public
    rule: ["1.5:108.7.c", "1.5:108.7.e"]
    title: 手牌内容仅持有者可读，数量对所有视角公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@unit(cost:1,might:2)#h1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"deal 1 to a unit\")#h2", "@spell(cost:1,text:\"deal 1 to a unit\")#h3" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: [], B: [] } }
      chain: []
    commands:
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "players.B.hand.count", equals: 2 }
      views:
        A: { "players.B.hand": count-only, "players.B.hand.count": 2, "players.A.hand.#h1.#identity": identity }
        B: { "players.A.hand": count-only, "players.A.hand.count": 1, "players.B.hand.#h2.#identity": identity }
        spectator: { "players.A.hand": count-only, "players.B.hand": count-only }
      rejected: null
    notes: 手牌内容对手牌拥有者是 Private（仅其可读正面），数量对所有人公开（108.7.e）；观战视角两个区域都只有数量。

  - id: privacy-spectator-deck-runedeck-secret-order
    rule: ["1.5:108.4.d", "1.5:108.4.e", "1.5:108.5.d"]
    title: 观战视角下双方牌库与符文库只有数量，无顺序与内容
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: []
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:1)", "@spell(cost:1,text:\"draw 1\")" ]
          runeDeck: [ fury, fury, fury ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
          mainDeck: [ "@unit(cost:1,might:1)" ]
          runeDeck: [ calm ]
      battlefields:
        - { id: bf1, controller: null }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "players.A.mainDeck.count", equals: 2 }
        - { path: "players.B.runeDeck.count", equals: 1 }
      views:
        A: { "players.A.mainDeck": count-only, "players.B.mainDeck": count-only, "players.A.runeDeck": count-only }
        B: { "players.A.mainDeck": count-only, "players.B.mainDeck": count-only }
        spectator: { "players.A.mainDeck": count-only, "players.B.mainDeck": count-only, "players.A.runeDeck": count-only, "players.B.runeDeck": count-only }
      rejected: null
    notes: 牌库/符文库的顺序与内容对所有人是 Secret（108.4.e、108.5.d），连牌库拥有者自己也不知道顺序；只有数量公开（108.4.d）。投影对四个视角都只给数量。

  - id: privacy-public-zones-visible-all-views
    rule: ["1.5:108.2.d", "1.5:108.6.e", "1.5:108.3.e", "1.5:107.1.d"]
    title: 弃牌、放逐、英雄区、基地内容对三个视角完全公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: []
          base: [ "@unit(might:3)#a1" ]
          score: 0
          trash: [ "@spell(cost:1,text:\"draw 1\")#t1" ]
          banishment: [ "@gear(cost:1)#x1" ]
          championZone: [ "@unit(might:4)#c1" ]
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: [], B: [] } }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "players.A.trash", contains: "#t1" }
      views:
        A: { "players.A.trash.#t1.#identity": identity, "players.A.banishment.#x1.#identity": identity, "players.A.championZone.#c1.#identity": identity, "players.A.base.#a1.#identity": identity }
        B: { "players.A.trash.#t1.#identity": identity, "players.A.banishment.#x1.#identity": identity, "players.A.championZone.#c1.#identity": identity, "players.A.base.#a1.#identity": identity }
        spectator: { "players.A.trash.#t1.#identity": identity, "players.A.banishment.#x1.#identity": identity, "players.A.championZone.#c1.#identity": identity, "players.A.base.#a1.#identity": identity }
      rejected: null
    notes: Trash（108.2.d）、Banishment（108.6.e）、Champion Zone（108.3.e）、Base 中的永久物与符文（107.1.d）都是 Public，三种视角看到的内容一致。

  - id: privacy-board-objects-state-public
    rule: ["1.5:109", "1.5:109.2"]
    title: 战场与基地上对象的正面信息与状态（横置/增益/伤害）全视角公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: []
          base: [ "@gear(cost:1,exhausted:true)#g1" ]
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: ["@unit(might:2,damage:1,buffed:true)#u1"], B: [] } }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "battlefields.bf1.units.A.#u1.damage", equals: 1 }
      views:
        A: { "battlefields.bf1.#u1.#identity": identity, "battlefields.bf1.#u1.state": visible, "players.A.base.#g1.state": visible }
        B: { "battlefields.bf1.#u1.#identity": identity, "battlefields.bf1.#u1.state": visible, "players.A.base.#g1.state": visible }
        spectator: { "battlefields.bf1.#u1.#identity": identity, "battlefields.bf1.#u1.state": visible, "players.A.base.#g1.state": visible }
      rejected: null
    notes: 场上对象的身份与状态（横置、Buff、已受伤害等）全部公开（109、109.2）；投影不应对任何视角隐藏伤害计数或横置状态。

  - id: privacy-facedown-slot-occupied-public-identity-private
    rule: ["1.5:107.3.f", "1.5:128.4"]
    title: 面朝下位置区占用状态公开，牌的身份仅控制者可见
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: [], B: [] }, facedown: { A: [ "@spell(cost:1,keywords:[hidden],text:\"kill a unit\")#f1" ] } }
      chain: []
    commands:
      - { player: A, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: A }
      state:
        - { path: "battlefields.bf1.facedown.A.count", equals: 1 }
      views:
        A: { "battlefields.bf1.facedown.A.count": 1, "battlefields.bf1.#f1.#identity": identity }
        B: { "battlefields.bf1.facedown.A.count": 1, "battlefields.bf1.#f1.#identity": face-down }
        spectator: { "battlefields.bf1.facedown.A.count": 1, "battlefields.bf1.#f1.#identity": face-down }
      rejected: null
    notes: Facedown Zone 是公开区——对手与观战都能看到「A 在 bf1 有一张背面牌」（107.3.f）；但牌的正面是 Private，只有其控制者可读（128.4）。对 B 与观战者，#f1 没有身份、费用、关键词等任何可引用特征。

  - id: privacy-chain-items-public
    rule: ["1.5:108.1.b"]
    title: 链上的牌与能力对所有视角公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:1,text:\"deal 1 to a unit\")" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: ["@unit(might:2)#u1"], B: [] } }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 }, targets: ["#u1"] }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-pending, item: "A:hand[0]" }
      state:
        - { path: "chain.count", equals: 1 }
      views:
        A: { "chain[0].#identity": identity }
        B: { "chain[0].#identity": identity }
        spectator: { "chain[0].#identity": identity }
      rejected: null
    notes: 打出的牌一进链就是 Public（108.1.b）：手牌中的 Private 状态在成为链项时结束，对手与观战者都能看到是哪张牌、选择了什么目标。

  # ---------- Hidden 与面朝下 ----------
  - id: privacy-hide-no-chain-preserves-privacy
    rule: ["1.5:422.1", "1.5:811.1.c.2", "1.5:107.3.f"]
    title: Hide 动作不开链，身份从手牌私有无缝转为面朝下私有
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
          hand: [ "@spell(cost:2,keywords:[hidden],text:\"kill a unit\")#h1" ]
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: ["@unit(might:2)#u1"], B: [] } }
      chain: []
    commands:
      - { player: A, do: hide, card: "hand[0]", to: bf1, pay: { energy: 1 } }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: zone.enter, object: "A:hand[0]", zone: "bf1.facedown" }
      state:
        - { path: "battlefields.bf1.facedown.A.count", equals: 1 }
        - { path: "players.A.hand.count", equals: 0 }
        - { path: "chain.count", equals: 0 }
      views:
        A: { "battlefields.bf1.#h1.#identity": identity }
        B: { "battlefields.bf1.#h1.#identity": face-down, "players.A.hand": count-only }
        spectator: { "battlefields.bf1.#h1.#identity": face-down }
      rejected: null
    notes: Hide 是自由动作、不开链（811.1.c.2），B 的视角里 A 手牌数量减 1、bf1 背面位多一张，但全程没有 chain.item-pending 事件泄露身份；B 无法从事件流知道藏的是哪张牌。

  - id: privacy-facedown-controller-not-owner-reads
    rule: ["1.5:128.4"]
    title: 面朝下牌的读取权属于控制者而非拥有者
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: [] }, facedown: { B: [ "@unit(cost:3,might:3,keywords:[hidden],owner:A)#f1" ] } }
      chain: []
    commands:
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: turn.priority-passed, player: B }
      state:
        - { path: "battlefields.bf1.facedown.B.count", equals: 1 }
      views:
        A: { "battlefields.bf1.#f1.#identity": face-down }
        B: { "battlefields.bf1.#f1.#identity": identity }
        spectator: { "battlefields.bf1.#f1.#identity": face-down }
      rejected: null
    notes: "128.4 的例子明确：控制战场上面朝下牌的玩家可看其正面，无论拥有者是谁。拥有者 A 反而只能看到背面。UNCERTAIN: 128.4 直接给出结论，但规则没有说明「控制权如何转移给非拥有者」的完整路径（通常是效果把对手牌面朝下放置到自己战场），本场景只断言投影结论。"

  - id: privacy-facedown-leaves-zone-revealed-to-all
    rule: ["1.5:422.4"]
    title: 面朝下牌换区时向所有人展示，之后进入公开区仍可见
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 1
          runes: { ready: [calm], exhausted: [] }
          hand: [ "@spell(cost:1,speed:reaction,text:\"return a facedown card to its owner's hand\")" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: [], B: [] }, facedown: { A: [ "@spell(cost:1,keywords:[hidden],text:\"deal 2 to a unit\")#f1" ] } }
      chain: []
    commands:
      - { player: B, do: play, card: "hand[0]", pay: { energy: 1 }, targets: ["#f1"] }
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: card.revealed, object: "#f1", audience: all }
          - { timing: zone.leave, object: "#f1", zone: "bf1.facedown" }
          - { timing: zone.enter, object: "#f1", zone: hand }
      state:
        - { path: "players.A.hand.count", equals: 1 }
        - { path: "battlefields.bf1.facedown.A.count", equals: 0 }
      views:
        A: { "players.A.hand.#f1.#identity": identity }
        B: { "players.A.hand.#f1.#identity": face-down, "players.A.hand": count-only }
        spectator: { "players.A.hand.#f1.#identity": face-down }
      rejected: null
    notes: "422.4 要求换区瞬间向所有人展示（card.revealed 事件对 B 与观战者含身份）；但展示状态随法术结算结束（425.1.a.3），进入手牌后恢复 Private——B 事后能凭记忆知道那是哪张，但投影里手牌中的 #f1 必须回到背面表示，这是投影正确性的关键断言。"

  - id: privacy-facedown-removed-on-cleanup-still-hidden-then-revealed
    rule: ["1.5:323.6.a", "1.5:107.3.d", "1.5:422.4"]
    title: 失控战场的面朝下牌在清理时移除，进入弃牌堆前向所有人展示
    kind: edge
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: B, units: { A: [], B: ["@unit(might:3)#u1"] }, facedown: { A: [ "@spell(cost:1,keywords:[hidden],text:\"kill a unit\")#f1" ] } }
      chain: []
    commands:
      - { player: A, do: pass, note: "触发一次清理：bf1 控制者 B 与 #f1 控制者 A 不同" }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: cleanup.started }
          - { timing: card.revealed, object: "#f1", audience: all }
          - { timing: zone.enter, object: "#f1", zone: trash }
      state:
        - { path: "battlefields.bf1.facedown.A.count", equals: 0 }
        - { path: "players.A.trash", contains: "#f1" }
      views:
        A: { "players.A.trash.#f1.#identity": identity }
        B: { "players.A.trash.#f1.#identity": identity }
        spectator: { "players.A.trash.#f1.#identity": identity }
      rejected: null
    notes: "清理移除失控战场的面朝下牌（323.6.a、107.3.d），移除即换区触发 422.4 展示，之后进入 Trash 是公开区，所有视角从此可见身份。UNCERTAIN: 323.6.a 写明 remove，107.3.d 的默认目的地按弃牌处理（107.3.b.2 同用 trash），但规则未在 323.6.a 处逐字写明目的地是 Trash，按「移除出游戏区域默认进拥有者弃牌堆」理解。"

  - id: privacy-game-end-facedown-revealed-all
    rule: ["1.5:422.4"]
    title: 游戏结束时仍面朝下的牌向所有人展示
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 8
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 3
      battlefields:
        - { id: bf1, controller: A, units: { A: ["@unit(might:3)#u1"], B: [] }, facedown: { A: [ "@unit(cost:2,might:2,keywords:[hidden])#f1" ] } }
      chain: []
    commands:
      - { player: A, do: pass, note: "A 已达成获胜分数，游戏结束" }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: game.ended }
          - { timing: card.revealed, object: "#f1", audience: all }
      state:
        - { path: "game.winner", equals: "A" }
      views:
        A: { "battlefields.bf1.#f1.#identity": identity }
        B: { "battlefields.bf1.#f1.#identity": identity }
        spectator: { "battlefields.bf1.#f1.#identity": identity }
      rejected: null
    notes: 422.4 并列规定「游戏结束」与换区一样触发向所有人展示；结束后该牌对所有视角（含回放）身份可见，防止赛后回放缺失信息。

  - id: privacy-facedown-not-referenceable-by-characteristics
    rule: ["1.5:811.5.a", "1.5:107.3.f"]
    title: 面朝下牌失去一切可引用特征，效果不能把它当作 Hidden 牌或某张牌
    kind: negative
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 1
          runes: { ready: [fury], exhausted: [] }
