          base: []
          score: 0
        B:
          energy: 0
          runes: { ready: [], exhausted: [] }
          hand: []
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: [], B: [] }, facedown: { A: [ "@spell(cost:1,keywords:[hidden],text:\"deal 2 to a unit\")#f1" ] } }
      chain: []
    commands:
      - { player: A, do: play, card: "hand[0]", pay: { energy: 1 } }
      - { player: A, do: pass }
      - { player: B, do: pass }
    expect:
      events:
        ordered: subsequence
        list:
          - { timing: chain.item-resolved, item: "A:hand[0]" }
      state:
        - { path: "players.A.damage", equals: 0 }
      views:
        A: { "battlefields.bf1.#f1.#identity": identity }
        B: { "battlefields.bf1.#f1.#identity": face-down }
      rejected: null
    notes: "#f1 的印刷含 Hidden，但 811.5.a 规定背面牌「不是带 Hidden 的牌」——数 Hidden 牌的效果数到 0，对 A 造成 0 伤害。断言点：引擎的特征查询对背面牌必须返回空特征，不能读到底层牌面。"

  - id: privacy-hidden-reaction-grant-not-public
    rule: ["1.5:811.6", "1.5:811.6.a"]
    title: 面朝下牌次回合获得的 Reaction 权限不对对手公开
    kind: positive
    given:
      turn: { active: A, phase: main, state: neutral-open }
      players:
        A:
          energy: 0
          runes: { ready: [fury], exhausted: [] }
          hand: []
          base: []
          score: 0
        B:
          energy: 1
          runes: { ready: [calm], exhausted: [] }
          hand: [ "@spell(cost:1,speed:reaction,text:\"deal 1 to a unit\")" ]
          base: []
          score: 0
      battlefields:
        - { id: bf1, controller: A, units: { A: ["@unit(might:2)#u1"], B: [] }, facedown: { A: [ "@spell(cost:0,keywords:[hidden],text:\"deal 2 to a unit\")#f1(hiddenOnTurn:1)" ] } }
      chain: []
    commands:
      - { player: B, do: play, card: "hand[0]", pay: { energy: 1 }, targets: ["#u1"] }
